<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>เอกสารรายงานการส่งหมาย</title>
    <style>
      :root{--google-bar-height:48px}
      html,body{width:100%;height:100%;margin:0;background:#0b1e3a;overflow:hidden}
      #frame-shell{position:fixed;inset:0;overflow:hidden;background:#f4f7fb}
      #app{position:absolute;left:0;top:0;display:block;width:100%;height:100%;border:0;background:#f4f7fb}
      body[data-mode="full"] #app{top:0;height:100%}
      #loading{position:fixed;inset:0;z-index:2;display:grid;place-content:center;gap:12px;text-align:center;font-family:Sarabun,system-ui,sans-serif;color:#f5cf78;background:radial-gradient(900px 500px at 15% -10%,rgba(100,159,239,.22),transparent 55%),linear-gradient(145deg,#071323,#102a4b);transition:opacity .25s ease}
      #loading[hidden],#timeout[hidden]{display:none}
      .mark{display:grid;place-items:center;width:60px;height:60px;margin:auto;border:1px solid rgba(245,207,120,.8);border-radius:18px;color:#fff;font:800 20px/1 system-ui,sans-serif}
      .title{font-size:17px;font-weight:700}.subtitle{color:#bdd0e7;font-size:12px}
      .spin{width:26px;height:26px;margin:5px auto 0;border:3px solid rgba(245,207,120,.22);border-top-color:#f5cf78;border-radius:50%;animation:spin .75s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.spin{animation:none}}
      #timeout{position:fixed;left:50%;top:50%;z-index:3;display:grid;gap:10px;max-width:360px;padding:20px;transform:translate(-50%,-50%);border-radius:16px;background:#fff;color:#172b4d;box-shadow:0 12px 36px rgba(0,0,0,.25);font:14px/1.6 Sarabun,system-ui,sans-serif;text-align:center}
      #timeout a{display:inline-block;padding:8px 14px;border-radius:10px;background:#c79732;color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body data-mode="crop">
    <div id="frame-shell">
      <iframe id="app" title="เอกสารรายงานการส่งหมาย" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
    </div>
    <div id="loading" role="status" aria-live="polite">
      <div class="mark">A4</div>
      <div class="title">เอกสารรายงานการส่งหมาย</div>
      <div class="subtitle">กำลังตรวจสอบสิทธิ์บัญชี Google</div>
      <div class="spin" aria-hidden="true"></div>
    </div>
    <div id="timeout" hidden>
      <div>ไม่สามารถโหลดระบบในกรอบ iframe ได้</div>
      <a href="?open=mobile">เปิดระบบแบบเต็มหน้า</a>
    </div>
    <script>
      (function(){
        var appUrl='https://script.google.com/macros/s/AKfycbxGNdwJbKBVALmMbXFpmbOjj6alGQ79_bsyrDWn7B4C9t7F2MczcvD352gx5Yw5tI3l3g/exec';
        var app=document.getElementById('app');
        var loading=document.getElementById('loading');
        var timeout=document.getElementById('timeout');
        var query=new URLSearchParams(window.location.search);
        var openFull=query.get('open')==='mobile';
        var showGoogleBar=query.get('show-google-bar')==='1';
        if(openFull){
          window.location.replace(appUrl);
          return;
        }
        if(showGoogleBar){document.body.setAttribute('data-mode','full')}
        function hideLoading(){
          loading.style.opacity='0';
          window.setTimeout(function(){loading.hidden=true},260);
        }
        app.addEventListener('load',hideLoading,{once:true});
        app.src=appUrl;
        window.setTimeout(function(){
          if(!loading.hidden){
            hideLoading();
            timeout.hidden=false;
          }
        },10000);
      }());
    </script>
  </body>
</html>
