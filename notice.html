<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>เอกสารรายงานการส่งหมาย</title>
    <style>
      html,body{width:100%;height:100%;margin:0;background:#0b1e3a;overflow:hidden}
      #app{display:block;width:100vw;height:100vh;height:calc(100dvh - env(safe-area-inset-bottom,0px));border:0;background:#f4f7fb}
      #loading{position:fixed;inset:0;z-index:2;display:grid;place-content:center;gap:12px;text-align:center;font-family:Sarabun,system-ui,sans-serif;color:#f5cf78;background:radial-gradient(900px 500px at 15% -10%,rgba(100,159,239,.22),transparent 55%),linear-gradient(145deg,#071323,#102a4b);transition:opacity .25s ease}
      #loading[hidden]{display:none}.mark{display:grid;place-items:center;width:60px;height:60px;margin:auto;border:1px solid rgba(245,207,120,.8);border-radius:18px;color:#fff;font:800 20px/1 system-ui,sans-serif}.title{font-size:17px;font-weight:700}.subtitle{color:#bdd0e7;font-size:12px}.spin{width:26px;height:26px;margin:5px auto 0;border:3px solid rgba(245,207,120,.22);border-top-color:#f5cf78;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div class="mark">A4</div>
      <div class="title">เอกสารรายงานการส่งหมาย</div>
      <div class="subtitle">กำลังตรวจสอบสิทธิ์บัญชี Google</div>
      <div class="spin" aria-hidden="true"></div>
    </div>
    <iframe id="app" title="เอกสารรายงานการส่งหมาย" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
    <script>
      const appUrl='https://script.google.com/macros/s/AKfycbxGNdwJbKBVALmMbXFpmbOjj6alGQ79_bsyrDWn7B4C9t7F2MczcvD352gx5Yw5tI3l3g/exec';
      const loading=document.getElementById('loading');
      const app=document.getElementById('app');
      const hideLoading=()=>{loading.style.opacity='0';setTimeout(()=>{loading.hidden=true},260)};
      const query=new URLSearchParams(window.location.search);
      const isTouchDevice=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
      const isMobileBrowser=/Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const forceTopLevel=query.get('open')==='mobile';
      if(forceTopLevel||isTouchDevice||isMobileBrowser){
        // Google account confirmation is blocked inside a third-party iframe on
        // many mobile browsers.  Open the same approved app at the top level.
        window.location.replace(appUrl);
      }else{
        app.src=appUrl;
        app.addEventListener('load',hideLoading,{once:true});
        window.setTimeout(hideLoading,7000);
        if(!(window.CSS&&CSS.supports&&CSS.supports('height','100dvh'))){
          const fit=()=>{app.style.height=`${(window.visualViewport&&window.visualViewport.height)||window.innerHeight}px`};
          fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>window.setTimeout(fit,300));
          if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
        }
      }
    </script>
  </body>
</html>
