<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>บัญชีนัดพิจารณาคดี — จอ TV — ศาลจังหวัดลพบุรี</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#12294c;overflow:hidden}
  #app{border:0;width:100vw;height:100vh;display:block}
  #load{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Sarabun',sans-serif;color:#e6c674;
    background:radial-gradient(1000px 500px at 15% -10%,rgba(201,162,75,.18),transparent 55%),linear-gradient(150deg,#0b1a33,#12294c 60%,#0d2144)}
  #load .em{width:70px;height:70px;border-radius:50%;font-size:32px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#1c3a68,#0c1c38);border:2px solid #c9a24b;margin-bottom:16px}
  #load .sp{width:34px;height:34px;border:4px solid rgba(230,198,116,.25);border-top-color:#e6c674;border-radius:50%;animation:s .8s linear infinite;margin:14px 0 10px}
  #load .nm{font-weight:600;font-size:16px} #load .su{font-size:12px;color:rgba(230,198,116,.7);margin-top:3px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="load"><div class="em">⚖</div><div class="nm">บัญชีนัดพิจารณาคดี — จอ TV</div><div class="su">ศาลจังหวัดลพบุรี</div><div class="sp"></div></div>
<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbyeAHSW2vjTf1KSV6xy-xBpeW0CGPxVJtuC2F7jQU77G7DkWdUYIDGl9-BJp2gEMUH67Q/exec?page=tv"
  onload="var l=document.getElementById('load');if(l)l.style.opacity=0,setTimeout(function(){l.style.display='none'},300)"
  allow="clipboard-write; fullscreen; geolocation; camera" allowfullscreen></iframe>
<script>setTimeout(function(){var l=document.getElementById('load');if(l)l.style.display='none';},6000);</script>
<script>
(() => {
  'use strict';
  const frame=document.getElementById('app'),target=new URL(frame.dataset.src),ticket=new URL(location.href).searchParams.get('musicPair');
  if(ticket&&/^[a-f0-9]{32}$/.test(ticket))target.searchParams.set('musicPair',ticket);
  const url=target.href;frame.src=url;
  let source=null,nonce='',last='';
  function belongsToTV(candidate){
    try{for(let depth=0;depth<6&&candidate;depth++){if(candidate===frame.contentWindow)return true;const next=candidate.parent;if(next===candidate)return false;candidate=next;}}catch(e){}
    return false;
  }
  window.addEventListener('message',event=>{
    const data=event.data;
    if(!data||!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(event.origin)||!belongsToTV(event.source))return;
    if(data.type==='bailoy-music-ready'&&/^[a-f0-9]{32}$/.test(data.nonce||'')){
      source=event.source;nonce=data.nonce;source.postMessage({type:'bailoy-music-ready-ack',nonce},event.origin);return;
    }
    if(data.type!=='bailoy-music-refresh'||event.source!==source||data.nonce!==nonce||!/^[a-f0-9]{32}$/.test(data.id||'')||data.id===last)return;
    last=data.id;source=null;nonce='';frame.src=url;
  });
})();
</script>
</body>
</html>
