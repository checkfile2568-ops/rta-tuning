<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMs Job Center</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="mms-pro.css"></head><body><div class="wrap"><header class="top glass"><div class="brand">MMs</div><div class="title">JOB CENTER<small>Queue • Worker • Background Processing</small></div><div class="spacer"></div><button class="btn" onclick="loadAll()">↻</button><button class="btn" data-mms-back>↑ เมนู</button></header><main class="grid"><section class="panel glass col-12"><div class="help">งาน Video / CCTV / Proxy จะทำต่อที่ Worker แม้คุณออกจากหน้านี้ • หาก Worker Offline งานจะค้างใน Queue โดยไม่หาย</div><div class="cards" id="metrics" style="margin-top:9px"></div></section><section class="panel glass col-12"><div class="row"><div><h2>งานประมวลผล</h2><div class="sub">ดู Progress ยกเลิก หรือ Retry ได้จากจุดเดียว</div></div><div class="spacer"></div><select id="status" onchange="loadAll()"><option value="">ทุกสถานะ</option><option>queued</option><option>processing</option><option>completed</option><option>failed</option><option>cancelled</option></select></div><div id="jobs" class="list"><div class="empty">กำลังโหลด...</div></div></section><section class="panel glass col-12"><h2>Media Worker</h2><div class="sub">แสดง Worker ที่ส่ง Heartbeat ภายใน 2 นาทีล่าสุด</div><div id="workers" class="cards"></div></section></main></div><div id="toast" class="toast"></div><script src="mms-pro-client.js"></script><script src="mms-shell-bridge.js"></script><script>const P=MmsPro,$=s=>document.querySelector(s);let D={jobs:[],workers:[]};function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}function badge(s){return s==='completed'?'good':s==='failed'?'bad':s==='processing'?'good':s==='cancelled'?'warn':'warn'}async function loadAll(){try{const d=await P.api('jobs-list',{status:$('#status').value||null});if(!d.ok)throw new Error(d.error);D=d;render()}catch(e){$('#jobs').innerHTML='<div class="empty">โหลด Job Center ไม่สำเร็จ</div>'}}function render(){const j=D.jobs||[],w=D.workers||[];const q=j.filter(x=>x.status==='queued').length,p=j.filter(x=>x.status==='processing').length,f=j.filter(x=>x.status==='failed').length;$('#metrics').innerHTML=`<div class="card"><span class="meta">รอคิว</span><div class="metric">${q}</div></div><div class="card"><span class="meta">กำลังทำ</span><div class="metric">${p}</div></div><div class="card"><span class="meta">ผิดพลาด</span><div class="metric">${f}</div></div><div class="card"><span class="meta">Worker Online</span><div class="metric">${w.length}</div></div>`;$('#jobs').innerHTML=j.length?j.map(x=>`<article class="item"><div class="item-head"><div class="grow"><b>${P.esc(x.job_type)}</b><div class="meta">${P.esc(x.module)} • ${P.dt(x.created_at)} • ครั้งที่ ${x.attempts}/${x.max_attempts}</div></div><span class="badge ${badge(x.status)}">${P.esc(x.status)}</span></div><div style="margin-top:8px" class="progress"><i style="width:${Number(x.progress)||0}%"></i></div><div class="row" style="margin-top:8px"><span class="meta">${Number(x.progress)||0}% ${x.error_message?'• '+P.esc(x.error_message):''}</span><div class="spacer"></div>${['queued','processing'].includes(x.status)?`<button class="btn danger" onclick="cancelJob('${x.id}')">ยกเลิก</button>`:''}${['failed','cancelled'].includes(x.status)?`<button class="btn" onclick="retryJob('${x.id}')">Retry</button>`:''}</div></article>`).join(''):'<div class="empty">ยังไม่มีงานในสถานะนี้</div>';$('#workers').innerHTML=w.length?w.map(x=>`<div class="card"><b>${P.esc(x.worker_id)}</b><div class="meta">${P.esc(x.worker_type)} • ${P.esc(x.status)} • ${P.dt(x.last_seen_at)}</div><div class="row" style="margin-top:7px"><span class="badge good">${P.esc(x.version||'worker')}</span>${Object.keys(x.capabilities||{}).length?'<span class="badge">FFmpeg / AI</span>':''}</div></div>`).join(''):'<div class="empty">ยังไม่มี Media Worker ออนไลน์ — งานใหม่จะรออยู่ใน Queue</div>'}async function cancelJob(id){const d=await P.api('job-cancel',{id});toast(d.ok?'ยกเลิกงานแล้ว':d.error||'ไม่สำเร็จ');loadAll()}async function retryJob(id){const d=await P.api('job-retry',{id});toast(d.ok?'ส่งกลับเข้าคิวแล้ว':d.error||'ไม่สำเร็จ');loadAll()}loadAll();setInterval(loadAll,9000);</script></body></html>
