<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatbot ศูนย์รวมข้อมูล - V12 Dashboard Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink-50:#fdf2f8;--pink-100:#fce7f3;--pink-200:#fbcfe8;--pink-400:#f472b6;--pink-500:#ec4899;--pink-600:#db2777;--pink-700:#be185d;--wine:#500724;--muted:#9d174d;--line:#fbcfe8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Prompt,sans-serif;background:linear-gradient(135deg,#fdf2f8 0%,#fce7f3 52%,#fff7fb 100%);color:var(--wine);overflow:hidden}
#splash,#login-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,rgba(253,242,248,.98) 0%,rgba(252,231,243,.98) 52%,rgba(255,247,251,.98) 100%);transition:opacity .35s ease,visibility .35s ease}
#login-gate{z-index:25;display:none}
.card{width:min(92vw,390px);padding:36px 28px;text-align:center;background:rgba(255,255,255,.96);border:1px solid var(--pink-200);border-radius:28px;box-shadow:0 26px 64px rgba(190,24,93,.16)}
.robot-mark{position:relative;width:88px;height:88px;margin:0 auto 16px;border-radius:24px;overflow:hidden;background:var(--pink-50);border:1px solid var(--pink-200);box-shadow:0 8px 22px rgba(190,24,93,.18)}
.robot-mark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.robot-mark .robot-closed-frame{opacity:0;transition:opacity .12s ease}
h1{margin:0;color:var(--wine);font-size:1.45rem;font-weight:700;perspective:720px}h1 span{color:var(--pink-600)}
.title-3d-letter{display:inline-block;min-width:.08em;opacity:0;transform:translateY(7px) rotateY(90deg) rotateX(12deg);transform-origin:50% 70%;transition:opacity .28s ease,transform .42s cubic-bezier(.2,.75,.2,1);text-shadow:1px 1px 0 var(--pink-200),2px 3px 0 rgba(157,23,77,.14),0 8px 16px rgba(157,23,77,.12)}
.title-3d-letter.is-visible{opacity:1;transform:translateY(0) rotateY(0deg) rotateX(0deg)}
.sub{margin-top:8px;color:var(--pink-700);background:var(--pink-100);padding:5px 12px;border-radius:999px;display:inline-block;font-size:.86rem;font-weight:500}
.status{margin:26px 0 12px;color:var(--muted);font-size:.87rem}
.bar{height:8px;border-radius:999px;background:var(--pink-100);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-500),#c084fc);transition:width .25s ease}
.pct{margin-top:8px;color:var(--muted);font-size:.76rem}
#login-form{display:none;margin-top:18px}
.login-note{margin:0 0 12px;color:var(--pink-700);background:var(--pink-100);padding:6px 12px;border-radius:999px;display:inline-block;font-size:.86rem;font-weight:500}
.password-row{position:relative;width:100%;margin:20px 0 12px}
input[type="password"],input[type="text"]{width:100%;min-height:52px;padding:14px 98px 14px 15px;border:1px solid var(--pink-200);border-radius:14px;font-family:inherit;font-size:1rem;text-align:left;outline:none;transition:all .2s;box-shadow:0 8px 22px rgba(157,23,77,.06)}
input[type="password"]:focus,input[type="text"]:focus{border-color:var(--pink-500);box-shadow:0 0 0 3px rgba(236,72,153,.15)}
button{position:relative;isolation:isolate;width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--pink-500),var(--pink-700));color:#fff;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 10px 24px rgba(190,24,93,.24);transition:transform .2s,box-shadow .2s}
button::after{content:"";position:absolute;inset:-3px;border:1.5px solid rgba(255,255,255,.92);border-radius:16px;opacity:0;pointer-events:none;box-shadow:0 0 0 0 rgba(236,72,153,0),0 0 0 rgba(255,255,255,0);transition:opacity .2s}
button:hover,button:focus-visible{box-shadow:0 12px 28px rgba(190,24,93,.3)}button:hover::after,button:focus-visible::after,button:active::after{opacity:.95;animation:buttonLightRing 1.6s ease-in-out infinite}button:active{transform:scale(.98)}
@keyframes buttonLightRing{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.1),0 0 4px rgba(255,255,255,.36)}50%{box-shadow:0 0 0 4px rgba(236,72,153,.22),0 0 16px rgba(255,255,255,.92)}}
#open-login-btn{margin-top:22px}
#toggle-password{position:absolute;top:6px;right:6px;width:auto;min-width:86px;min-height:40px;padding:8px 10px;font-size:.78rem;white-space:nowrap;background:var(--pink-100);color:var(--pink-700);border:1px solid var(--pink-200);box-shadow:none}
#submit-login-btn{margin-top:4px}
#app{position:fixed;inset:0;display:none;background:#fff}#app iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:420px){.card{padding:30px 20px}.robot-mark{width:80px;height:80px}input[type="password"],input[type="text"]{padding-right:88px}#toggle-password{min-width:78px;padding-left:7px;padding-right:7px}}
</style>
</head>
<body>
<div id="splash"><div class="card"><div class="robot-mark" aria-label="หุ่นยนต์ผู้ช่วย"><img class="robot-open-frame" alt="หุ่นยนต์" src="assets/robot-open.jpg"><img class="robot-closed-frame" alt="หุ่นยนต์หลับตา" src="assets/robot-closed.jpg"></div><h1>Chatbot <span id="splash-title"></span></h1><div class="sub">V12 Dashboard Login</div><div class="status" id="status">กำลังเชื่อมต่อ Dashboard...</div><div class="bar"><i id="fill"></i></div><div class="pct" id="pct">0%</div></div></div>
<div id="login-gate"><div class="card"><div class="robot-mark" aria-label="หุ่นยนต์ผู้ช่วย"><img class="robot-open-frame" alt="หุ่นยนต์" src="assets/robot-open.jpg"><img class="robot-closed-frame" alt="หุ่นยนต์หลับตา" src="assets/robot-closed.jpg"></div><h1>ยืนยัน <span>ตัวตน</span></h1><button id="open-login-btn" type="button" onclick="showPasswordForm()">เข้าสู่ระบบ</button><div id="login-form"><div class="login-note">กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบ</div><div class="password-row"><input type="password" id="passkey" placeholder="รหัสผ่านผู้ดูแลระบบ" autocomplete="current-password"><button id="toggle-password" type="button" onclick="togglePassword()">แสดงรหัส</button></div><button id="submit-login-btn" type="button" onclick="checkLogin()">เข้าสู่ระบบ</button></div></div></div>
<div id="app"><iframe id="frame" title="Dashboard" referrerpolicy="no-referrer"></iframe></div>
<script>
var BASE_URL='https://script.google.com/macros/s/AKfycbwojYt6ZB4aAI8QvKqFdFzr3_72ccwYRnhYENrAF-7PpRyr6AOBkL7NWOg5KELipznp/exec';
var splash=document.getElementById('splash'),loginGate=document.getElementById('login-gate'),app=document.getElementById('app'),frame=document.getElementById('frame'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),status=document.getElementById('status'),passInput=document.getElementById('passkey'),loginForm=document.getElementById('login-form'),openLoginBtn=document.getElementById('open-login-btn');
var progress=0,done=false,titleTimer=null,titleLoopTimer=null;
function animateTitle(){var el=document.getElementById('splash-title');if(!el)return;if(titleTimer)clearInterval(titleTimer);if(titleLoopTimer)clearTimeout(titleLoopTimer);var text='ศูนย์รวมข้อมูล';el.innerHTML=Array.from(text).map(function(ch){return '<span class="title-3d-letter">'+(ch===' '?'&nbsp;':ch)+'</span>';}).join('');var letters=el.querySelectorAll('.title-3d-letter'),i=0;titleTimer=setInterval(function(){if(i<letters.length){letters[i].classList.add('is-visible');i++;return}clearInterval(titleTimer);titleTimer=null;titleLoopTimer=setTimeout(animateTitle,5000)},80)}
function startBlinkAnimations(){document.querySelectorAll('.robot-mark').forEach(function(mark){var closed=mark.querySelector('.robot-closed-frame');if(!closed)return;function blink(){closed.style.opacity='1';setTimeout(function(){closed.style.opacity='0';setTimeout(blink,1820)},180)}blink()})}
function updateProgress(){if(done)return;progress=Math.min(100,progress+(progress<70?5:2.5));fill.style.width=progress+'%';pct.textContent=Math.round(progress)+'%';if(progress<100)setTimeout(updateProgress,60);else showLogin()}
function showLogin(){done=true;status.textContent='พร้อมใช้งาน';setTimeout(function(){splash.style.opacity='0';splash.style.visibility='hidden';loginGate.style.display='grid';setTimeout(function(){openLoginBtn.focus()},120)},300)}
function showPasswordForm(){openLoginBtn.style.display='none';loginForm.style.display='block';passInput.focus()}
function togglePassword(){var isPassword=passInput.type==='password';passInput.type=isPassword?'text':'password';document.getElementById('toggle-password').textContent=isPassword?'ซ่อนรหัส':'แสดงรหัส'}
function checkLogin(){if(loginForm.style.display==='none'||!loginForm.style.display)showPasswordForm();var key=passInput.value.trim();if(!key){alert('กรุณากรอกรหัสผ่าน');passInput.focus();return}status.textContent='กำลังเชื่อมต่อระบบ...';location.href=BASE_URL+'?adminKey='+encodeURIComponent(key)}
passInput.addEventListener('keypress',function(e){if(e.key==='Enter')checkLogin()});
window.addEventListener('load',function(){animateTitle();startBlinkAnimations();updateProgress()});
</script>
</body>
</html>
