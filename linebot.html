<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatbot ศูนย์ข้อมูล | V12 Fix Duplicate Dashboard Login Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fa8;--pink2:#ffb5c5;--blue:#65b9f3;--ink:#24364b;--muted:#8090a2}
*{box-sizing:border-box;margin:0;padding:0;font-family:Prompt,sans-serif}
html,body{height:100%;overflow:hidden;background:#f8fbff;-webkit-tap-highlight-color:transparent}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;transition:opacity .55s ease,visibility .55s;background:linear-gradient(135deg,#fff0f4 0%,#fbfdff 50%,#edf8ff 100%)}
#splash:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 18%,rgba(255,143,168,.23),transparent 28%),radial-gradient(circle at 92% 22%,rgba(101,185,243,.18),transparent 30%)}
.scene{position:relative;z-index:1;width:min(96vw,620px);height:min(88vh,700px);min-height:520px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.stage{position:relative;z-index:3;width:min(82vw,380px);height:100%;min-height:520px;padding:42px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid #e7eef5;border-radius:28px;box-shadow:0 26px 64px rgba(65,91,116,.13);overflow:hidden}
.stage:before{content:"";position:absolute;left:-20%;right:-20%;bottom:-9%;height:25%;border-radius:50% 50% 0 0;background:linear-gradient(135deg,rgba(255,181,197,.26),rgba(255,255,255,0))}
.stage:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-78px;top:55px;background:rgba(191,229,255,.30)}

@keyframes botBlinkLoop{0%,91%,100%{opacity:0;transform:scaleY(.06)}94%,97%{opacity:1;transform:scaleY(1)}}

.brand-icon{width:80px;height:80px;border-radius:50%;display:block;margin-bottom:16px;background:#fff;box-shadow:0 10px 30px rgba(117,80,194,.18);font-size:0;position:relative;overflow:hidden}
.brand-icon img{display:block;width:100%;height:100%;object-fit:cover}
.brand-icon .lid{position:absolute;z-index:2;top:55%;width:23%;height:19%;border-radius:50%;background:linear-gradient(145deg,#7c58c8,#5b35ad);opacity:0;transform:scaleY(.06);transform-origin:center;animation:botBlinkLoop 2s ease-in-out infinite}
.brand-icon .lid.l{left:24%}.brand-icon .lid.r{left:53%}
.stage h1{font-size:1.45rem;font-weight:600;color:var(--ink);line-height:1.25;position:relative;z-index:1}.stage h1 span{color:var(--pink)}
.sub{color:#58aee8;font-size:.86rem;margin-top:8px;padding:5px 12px;border-radius:999px;background:#eef8ff;position:relative;z-index:1}
.status{display:inline-flex;align-items:center;gap:8px;margin:28px 0 11px;font-size:.87rem;color:var(--ink);position:relative;z-index:1}.status .dot{width:8px;height:8px;border-radius:50%;background:#54c79b;animation:live 1.6s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(84,199,155,.45)}70%{box-shadow:0 0 0 9px rgba(84,199,155,0)}100%{box-shadow:0 0 0 0 rgba(84,199,155,0)}}
.bar{width:100%;max-width:300px;height:9px;border-radius:999px;background:#eef2f6;overflow:hidden;position:relative;z-index:1}.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ff9db4,#ff7999 58%,#65b9f3);transition:width .3s ease}.pct{font-size:.76rem;color:#8291a2;margin-top:8px;position:relative;z-index:1}.wait-note{margin-top:24px;width:100%;max-width:300px;padding:13px 15px;border-radius:16px;background:#fbfdff;border:1px solid #edf1f5;color:#607286;font-size:.75rem;line-height:1.5;position:relative;z-index:1}
#app{position:fixed;inset:0;z-index:10;display:none;background:#f8fbff}#app iframe{width:100%;height:100%;border:0;display:block;background:#f8fbff}#reopen{position:fixed;right:14px;bottom:14px;z-index:15;display:none;padding:9px 14px;border-radius:11px;color:#fff;background:linear-gradient(135deg,#ffabc0,#ff7f9d);text-decoration:none;box-shadow:0 8px 22px rgba(255,127,157,.28);font-size:.82rem}
@media(max-width:480px){#splash{padding:10px}.scene{width:98vw;height:86vh;min-height:500px}.stage{width:78vw;min-height:500px;padding:32px 18px}.brand-icon{width:70px;height:70px;font-size:30px}.stage h1{font-size:1.25rem}.wait-note{font-size:.68rem}}
@media(max-height:620px){.scene{height:94vh;min-height:440px}.stage{min-height:440px;padding:22px 16px}.brand-icon{width:58px;height:58px;margin-bottom:10px}.status{margin:18px 0 9px}.wait-note{margin-top:15px}}
@media(prefers-reduced-motion:reduce){.brand-icon .lid,.status .dot{animation:none!important}}
</style>
</head>
