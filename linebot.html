<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบสารสนเทศราชการ — ศาลจังหวัดลพบุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--gold:#fbbf24;--gold-soft:#fcd34d;--blue:#60a5fa;--navy:#0a0f1e}*{box-sizing:border-box;margin:0;padding:0;font-family:Prompt,sans-serif}html,body{height:100%;overflow:hidden;background:var(--navy);-webkit-tap-highlight-color:transparent}
  #splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;color:#eef2ff;transition:opacity .55s ease,visibility .55s;background:linear-gradient(160deg,#070a14,#0a0f1e 55%,#0e1430)}#splash::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(1000px 600px at 50% 8%,rgba(251,191,36,.20),transparent 56%),radial-gradient(820px 520px at 84% 104%,rgba(96,165,250,.14),transparent 52%);animation:float 9s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(0)}to{transform:translateY(-16px)}}.stage{position:relative;z-index:1;width:min(90vw,420px);padding:20px}.emblem{position:relative;width:132px;height:132px;margin:0 auto 26px}.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--blue),var(--gold-soft),var(--gold));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 1.5s linear infinite;filter:drop-shadow(0 0 14px rgba(251,191,36,.4))}@keyframes spin{to{transform:rotate(360deg)}}.badge{position:absolute;inset:16px;border-radius:32px;display:grid;place-items:center;font-size:44px;background:linear-gradient(160deg,rgba(30,36,72,.9),rgba(10,15,30,.95));border:1px solid rgba(251,191,36,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.stage h1{font-size:1.5rem;font-weight:600;letter-spacing:.4px;background:linear-gradient(90deg,var(--gold-soft),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:#9aa6c4;font-weight:300;font-size:.95rem;margin-top:6px}.status{display:inline-flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:.85rem;color:#bcd4f5}.status .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:live 1.6s infinite}@keyframes live{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}.bar{width:min(80vw,320px);height:7px;margin:0 auto;border-radius:999px;background:rgba(251,191,36,.15);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .3s ease}.pct{font-size:.78rem;color:#9aa6c4;letter-spacing:1px;margin-top:8px}
  #app{position:fixed;inset:0;z-index:10;display:none;background:var(--navy)}#app iframe{width:100%;height:100%;border:0;display:block;background:var(--navy)}#reopen{position:fixed;right:14px;bottom:14px;z-index:15;display:none;padding:9px 14px;border-radius:11px;color:#2a1c00;background:linear-gradient(135deg,#f6b545,#f59e0b);text-decoration:none;box-shadow:0 8px 22px rgba(251,191,36,.34);font-size:.82rem}
</style>
</head>
<body>
  <div id="splash"><div class="stage"><div class="emblem"><div class="ring"></div><div class="badge">🤖</div></div><h1>ระบบสารสนเทศราชการ</h1><div class="sub">ศาลจังหวัดลพบุรี · LINE OA</div><div class="status"><span class="dot"></span><span id="statusText">กำลังเตรียมระบบเข้าสู่ Dashboard…</span></div><div class="bar"><i id="barFill"></i></div><div class="pct" id="pctText">0%</div></div></div>
  <div id="app"><iframe id="appFrame" title="Dashboard" referrerpolicy="no-referrer"></iframe></div>
  <a id="reopen" href="#" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>
<script>
  var DASH_URL="https://script.google.com/macros/s/AKfycbwojYt6ZB4aAI8QvKqFdFzr3_72ccwYRnhYENrAF-7PpRyr6AOBkL7NWOg5KELipznp/exec";
  var splash=document.getElementById('splash'),app=document.getElementById('app'),frame=document.getElementById('appFrame'),fill=document.getElementById('barFill'),pct=document.getElementById('pctText'),reopen=document.getElementById('reopen'),statusText=document.getElementById('statusText'),progress=0,shown=false;
  frame.src=DASH_URL;
  frame.addEventListener('load',function(){if(shown)return;shown=true;progress=100;fill.style.width='100%';pct.textContent='100%';statusText.textContent='พร้อมใช้งาน';setTimeout(function(){splash.style.opacity='0';splash.style.visibility='hidden';app.style.display='block';reopen.href=DASH_URL;reopen.style.display='block';},350);});
  var timer=setInterval(function(){if(shown){clearInterval(timer);return;}progress=Math.min(90,progress+(progress<60?4:1.5));fill.style.width=progress+'%';pct.textContent=Math.round(progress)+'%';},90);
  setTimeout(function(){if(!shown){statusText.textContent='หากค้างนาน กดปุ่มมุมขวาล่างเพื่อเปิดในแท็บใหม่';reopen.href=DASH_URL;reopen.style.display='block';}},12000);
</script>
</body>
</html>
