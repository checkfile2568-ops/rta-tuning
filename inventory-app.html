</script><script>/* Shared business rules. No credentials, network calls or browser state. */
var InventoryCore = (function () {
  'use strict';
  const pending=['PENDING','PREPARING','READY'];
  const roles=['USER','HEAD','OFFICER','ADMIN'];
  const copy=x=>JSON.parse(JSON.stringify(x));
  const round=n=>Math.round((n+Number.EPSILON)*1e6)/1e6;
  function fail(code){throw new Error(code);}
  function requireRole(actor,allowed){if(!actor||!roles.includes(actor.role)||!allowed.includes(actor.role))fail('FORBIDDEN');}
  function text(v,max=500){if(typeof v!=='string'||!v.trim()||v.length>max)fail('INVALID_TEXT');return v.trim();}
  function number(v,min=0,max=1e9){if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)fail('INVALID_NUMBER');return round(v);}
  function count(v){return number(v,0.000001);}
  const bool=v=>v===true||String(v).toUpperCase()==='TRUE';
  const id=(ctx,prefix)=>prefix+'_'+ctx.uuid.replace(/-/g,'');
  function one(s,t,k,v){const row=s.tables[t].find(x=>x[k]===v);if(!row)fail('NOT_FOUND');return row;}
  function material(s,id){const m=one(s,'MATERIALS','mat_id',id);if(!bool(m.active))fail('MATERIAL_INACTIVE');return m;}
  function conversion(s,matId,unitId){const m=material(s,matId),u=one(s,'UNITS','unit_id',unitId||m.unit_id);if(!bool(u.active))fail('UNIT_INACTIVE');
    if(u.unit_id===m.unit_id)return {unit_id:u.unit_id,name:u.name,factor:1};
    const cv=s.tables.MATERIAL_UNITS.find(x=>x.mat_id===matId&&x.unit_id===u.unit_id&&bool(x.active));if(!cv)fail('CONVERSION_REQUIRED');
    return {unit_id:u.unit_id,name:u.name,factor:count(cv.factor_to_base)};
  }
  function seq(s,type){s.meta.sequences[type]=(s.meta.sequences[type]||0)+1;return {REQ:'บก',PO:'สซ',RCV:'รบ',ADJ:'ปย',RET:'คน'}[type]+' '+s.meta.fy+'/'+String(s.meta.sequences[type]).padStart(4,'0');}
  function audit(s,a,action,entity,entityId,detail,ctx){s.tables.AUDIT_LOG.push({log_id:id(ctx,'AUD')+'_'+s.tables.AUDIT_LOG.length,ts:ctx.now,user_id:a.user_id,action,entity,entity_id:entityId,detail_json:JSON.stringify(detail)});}
  function activeLines(s,req){return s.tables.REQUEST_ITEMS.filter(l=>l.req_id===req.req_id);}
  function approved(l){return l.qty_approved===''||l.qty_approved==null?l.qty_req:l.qty_approved;}
  function reservation(s,matId){let n=0;for(const r of s.tables.REQUESTS)if(pending.includes(r.status))for(const l of activeLines(s,r))if(l.mat_id===matId)n+=approved(l);return round(n);}
  function syncReserved(s){for(const m of s.tables.MATERIALS)m.reserved=reservation(s,m.mat_id);}
  function ledger(s,a,m,type,qty,price,ref,ctx,dept=''){
    if(!s.meta.synthetic&&!s.meta.costMethod)fail('COST_METHOD_REQUIRED');
    if(s.meta.costMethod!=='WEIGHTED_AVERAGE')fail('COST_METHOD_NOT_IMPLEMENTED');
    qty=number(qty,-1e9,1e9);price=number(price);
    const before=number(m.balance),after=round(before+qty);if(after<0)fail('INSUFFICIENT_STOCK');
    if(after<m.reserved&&qty<0&&type!=='ISSUE')fail('BELOW_RESERVED');
    if(qty>0){m.avg_cost=after?round((before*m.avg_cost+qty*price)/after):0;m.last_cost=price;}
    m.balance=after;
    s.tables.STOCK_LEDGER.push({ledger_id:s.tables.STOCK_LEDGER.length+1,ts:ctx.now,fy:s.meta.fy,mat_id:m.mat_id,type,ref_id:ref.id,ref_item_id:ref.id+':'+m.mat_id,ref_no:ref.no,operation_uuid:ctx.uuid,qty_in:Math.max(qty,0),qty_out:Math.max(-qty,0),unit_cost:price,balance_after:after,dept_id:dept,by:a.user_id});
  }
  function check(s){const issues=[];for(const m of s.tables.MATERIALS){const rows=s.tables.STOCK_LEDGER.filter(l=>l.mat_id===m.mat_id&&l.fy===s.meta.fy);const q=round(rows.reduce((n,l)=>n+l.qty_in-l.qty_out,0)),r=reservation(s,m.mat_id);if(Math.abs(q-m.balance)>0.00001)issues.push({mat_id:m.mat_id,field:'balance',actual:m.balance,expected:q});if(Math.abs(r-m.reserved)>0.00001)issues.push({mat_id:m.mat_id,field:'reserved',actual:m.reserved,expected:r});if(m.balance<0||m.reserved<0||m.reserved>m.balance)issues.push({mat_id:m.mat_id,field:'negative_or_over_reserved'});}
    const keys=new Set();for(const l of s.tables.STOCK_LEDGER){const k=l.operation_uuid+':'+l.mat_id+':'+l.type;if(keys.has(k))issues.push({mat_id:l.mat_id,field:'duplicate_ledger'});keys.add(k);}return {ok:!issues.length,issues};}
  function inputLines(data){if(!Array.isArray(data.lines)||!data.lines.length||data.lines.length>100)fail('LINES_REQUIRED');const seen=new Set();for(const l of data.lines){if(typeof l.mat_id!=='string'||seen.has(l.mat_id))fail('DUPLICATE_MATERIAL');seen.add(l.mat_id);}return data.lines;}
  function reqAccess(a,r){if(a.role==='OFFICER'||a.role==='ADMIN'||r.user_id===a.user_id||a.role==='HEAD'&&r.dept_id===a.dept_id)return;fail('FORBIDDEN');}
  function doAction(s,a,action,d,ctx){let result={};const officer=()=>requireRole(a,['OFFICER']);const admin=()=>requireRole(a,['ADMIN']);
    switch(action){
    case 'request.submit':{

      const lines=inputLines(d).map(l=>{const m=material(s,l.mat_id),qty=count(l.qty);if(qty>m.max_per_request)fail('MAX_PER_REQUEST');if(qty>round(m.balance-m.reserved))fail('INSUFFICIENT_AVAILABLE');const u=one(s,'UNITS','unit_id',m.unit_id);return {req_id:id(ctx,'REQ'),mat_id:m.mat_id,qty_req:qty,qty_approved:'',qty_ready:0,qty_issued:0,unit_id_snapshot:u.unit_id,unit_name_snapshot:u.name,unit_cost:0};});
      const dept=one(s,'DEPARTMENTS','dept_id',a.dept_id),head=s.tables.USERS.find(u=>u.user_id===dept.head_user_id);
      const r={req_id:id(ctx,'REQ'),req_no:seq(s,'REQ'),fy:s.meta.fy,user_id:a.user_id,dept_id:a.dept_id,head_user_id:head?head.user_id:'',requester_name_at_submit:a.full_name,requester_position_at_submit:a.position||'',dept_name_at_submit:dept.name,head_name_at_submit:head?head.full_name:'',issuer_name_at_issue:'',status:s.meta.approvalEnabled?'PENDING':'PREPARING',purpose:String(d.purpose||'').slice(0,500),created_at:ctx.now,approved_by:'',approved_at:'',ready_by:'',ready_at:'',issued_by:'',issued_at:'',receiver_name:'',cancelled_at:'',reason:''};
      s.tables.REQUESTS.push(r);s.tables.REQUEST_ITEMS.push(...lines);syncReserved(s);result={req_id:r.req_id,req_no:r.req_no};break;}

const messages={FORBIDDEN:'บัญชีนี้ไม่มีสิทธิ์ดำเนินการ',OUTSTANDING_REQUEST:'คุณมีคำขอค้างอยู่ กรุณารอหรือยกเลิกใบเดิมก่อน',INSUFFICIENT_AVAILABLE:'จำนวนที่ขอเกินยอดพร้อมเบิก',MAX_PER_REQUEST:'เกินจำนวนเบิกสูงสุดต่อครั้ง',INVALID_STATE:'สถานะเอกสารเปลี่ยนแล้ว กรุณาโหลดข้อมูลล่าสุด',OVER_READY:'จำนวนส่งมอบเกินจำนวนที่เตรียม',OVER_APPROVED:'จำนวนเตรียมเกินจำนวนที่อนุมัติ',BELOW_RESERVED:'ยอดตรวจนับต่ำกว่ายอดจอง กรุณาจัดการคำขอค้างก่อน',OVER_RETURN:'จำนวนคืนเกินจำนวนที่ยังคืนได้',PO_NOT_RECEIVABLE:'ใบสั่งซื้อนี้ปิดแล้วหรือยังไม่สั่งซื้อ',OVER_PO:'รับเกินจำนวนค้างของใบสั่งซื้อ',SESSION_EXPIRED:'หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่ ร่างของคุณยังอยู่',BAD_LOGIN:'กุญแจทดสอบไม่ถูกต้อง',STAGING_NOT_CONFIGURED:'คลังทดสอบส่วนกลางยังติดตั้งไม่เสร็จ ใช้ข้อมูลตัวอย่างก่อนได้',IDENTITY_INTEGRATION_NOT_CONFIGURED:'การเชื่อมบัญชีจริงกำลังจัดเตรียม กรุณาใช้ปุ่มทดลองงานด้านล่าง',COST_METHOD_REQUIRED:'ต้องกำหนดวิธีต้นทุนก่อนบันทึกข้อมูลจริง',COST_METHOD_NOT_IMPLEMENTED:'รุ่นนี้รองรับถัวเฉลี่ยในข้อมูลทดสอบ ยังไม่เปิด FIFO',INVALID_TEXT:'กรุณากรอกข้อความที่จำเป็นให้ครบ',INVALID_NUMBER:'จำนวนหรือราคาไม่ถูกต้อง',DUPLICATE_CODE:'รหัสวัสดุนี้มีแล้ว',USE_CANCELLATION:'ไม่มีจำนวนส่งมอบ ให้ใช้การยกเลิกพร้อมเหตุผล',REPAIR_REQUIRED:'มีรายการบันทึกค้าง กรุณาให้ผู้ดูแลตรวจซ่อมก่อน',NEEDS_REPAIR:'รายการเขียนไม่ครบ ระบบเก็บแผนซ่อมไว้แล้ว กรุณาแจ้งผู้ดูแล',UUID_CONFLICT:'รหัสรายการเดิมถูกใช้กับข้อมูลต่างกัน กรุณาแจ้งผู้ดูแล',BASE_UNIT_LOCKED:'เปลี่ยนหน่วยหลักไม่ได้เพราะวัสดุมีประวัติแล้ว',NO_CHANGE:'ยอดตรวจนับเท่ากับยอดในระบบ',USE_PO_UNIT:'กรุณารับเข้าด้วยหน่วยตามใบสั่งซื้อ',RECONCILIATION_REQUIRED:'ยอดไม่ตรงบัญชีความเคลื่อนไหว ต้องตรวจซ่อมก่อน'};
let page='home',mode='',actor=null,view=null,busy=false,search='',category='',dialogHandler=null;
let db=read('iv-stage-db',null)||C.initial(IV_SCHEMA,new Date().toISOString());
function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback;}catch{return fallback;}}
function persist(){localStorage.setItem('iv-stage-db',JSON.stringify(db));}
function draftKey(){return 'iv-draft-'+mode+'-'+actor.user_id;}
function draft(){return read(draftKey(),{items:{},purpose:''});}
function saveDraft(d){localStorage.setItem(draftKey(),JSON.stringify(d));}
const money=n=>new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const num=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:3}).format(n||0);
const date=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
const mat=id=>view.materials.find(m=>m.mat_id===id),unit=id=>view.units.find(u=>u.unit_id===id)?.name||id;
const isOfficer=()=>actor?.role==='OFFICER',isMoney=()=>['OFFICER','ADMIN'].includes(actor?.role),isAdmin=()=>actor?.role==='ADMIN';
function badge(st){return `<span class="badge ${['READY','ORDERED','PREPARING'].includes(st)?'blue':['PARTIAL','PENDING','CLOSED_SHORT'].includes(st)?'warn':['CANCELLED','REJECTED'].includes(st)?'neutral':''}">${esc(statusNames[st]||st)}</span>`;}
function toast(message){$('toast').textContent=message;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',5500);}
function message(err){return messages[err.message]||err.message||'ดำเนินการไม่สำเร็จ';}
function setBusy(v){busy=v;document.querySelectorAll('button[data-write],#confirm-modal').forEach(b=>b.disabled=v);if(v&&!$('busy'))document.body.insertAdjacentHTML('beforeend','<div id="busy"></div>');if(!v)$('busy')?.remove();}
async function post(action,data={},uuid){const token=sessionStorage.getItem('iv-token')||'',controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'inventory.'+action,token,data,client_uuid:uuid}),mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal});if(!r.ok)throw Error('ผลรายการยังไม่ทราบ กรุณาตรวจรายการเดิม');const out=await r.json();if(typeof out.ok!=='boolean')throw Error('คำตอบไม่ครบ กรุณาตรวจรายการเดิม');if(!out.ok){const e=Error(out.error?.code||'INTERNAL_ERROR');e.known=true;throw e;}return out.data;}catch(e){if(e.name==='AbortError')throw Error('หมดเวลารอ ผลรายการยังไม่ทราบ กรุณาตรวจรายการเดิม');throw e;}finally{clearTimeout(timer);}}
async function refresh(){if(mode==='live')view=await post('state');else view=C.view(db,C.getActor(db,actor.user_id));actor=view.actor;render();}
async function mutate(action,data,existing){if(busy)return;const pending=read('iv-pending-'+actor.user_id,null);if(mode==='live'&&pending&&!existing)throw Error('ยังมีรายการรอผล กรุณากดตรวจ/ส่งรายการเดิมก่อน');const op=existing||{action,data,uuid:crypto.randomUUID(),actor_id:actor.user_id,apiUrl:API_URL};if(op.actor_id!==actor.user_id||op.apiUrl!==API_URL)throw Error('รายการค้างไม่ตรงบัญชีหรือปลายทาง');setBusy(true);
 try{let result;if(mode==='live'){localStorage.setItem('iv-pending-'+actor.user_id,JSON.stringify(op));result=await post(op.action,op.data,op.uuid);localStorage.removeItem('iv-pending-'+actor.user_id);}else{const ops=read('iv-demo-ops',{}),signature=JSON.stringify({action:op.action,data:op.data,actor:actor.user_id});if(ops[op.uuid]){if(ops[op.uuid].signature!==signature)throw Error('UUID_CONFLICT');result=ops[op.uuid].result;}else{const tx=C.transact(db,C.getActor(db,actor.user_id),op.action,op.data,{uuid:op.uuid,now:new Date().toISOString()});db=tx.state;persist();result=tx.result;ops[op.uuid]={signature,result};localStorage.setItem('iv-demo-ops',JSON.stringify(ops));}}await refresh();return result;}
 catch(e){if(mode==='live'&&e.known&&!['NEEDS_REPAIR','REPAIR_REQUIRED','SESSION_EXPIRED'].includes(e.message))localStorage.removeItem('iv-pending-'+actor.user_id);throw e;}finally{setBusy(false);}}
function loginPage(){return `<div class="login"><section class="login-visual"><div class="mark">ว</div><p class="eyebrow" style="margin-top:28px">LOPBURI PROVINCIAL COURT</p><h1>วัสดุพร้อม<br>งานเดินต่อ</h1><p>เบิกง่าย จัดเตรียมไว<br>ติดตามได้ทุกขั้นตอนในที่เดียว</p><div style="margin-top:40px;border-top:1px solid #ffffff22;padding-top:20px"><small style="color:#b5c4d2">ระบบเบิกวัสดุ · ศาลจังหวัดลพบุรี</small></div></section><section class="login-form"><p class="eyebrow">MATERIAL REQUISITION</p><h2>เข้าสู่ระบบเบิกวัสดุ</h2><p class="muted">รุ่นทดลอง · เลือกมุมมองด้านล่างเพื่อเริ่มงานได้ทันที</p><form id="login-form"><label>ชื่อผู้ใช้<input name="username" autocomplete="username" disabled placeholder="กำลังเชื่อมบัญชีจริง"></label><label>PIN<input name="pin" type="password" inputmode="numeric" disabled placeholder="ยังไม่เปิดบัญชีจริง"></label><button disabled>บัญชีจริงยังไม่เปิดในรุ่นทดลอง</button></form><div class="divider"><h3>ลองงานได้ทันที</h3><p class="muted">ใช้ข้อมูลสังเคราะห์ในอุปกรณ์นี้ เลือกมุมมองที่ต้องการ</p><div class="trial-roles">${Object.entries(roleNames).map(([r,n])=>`<button class="outline" data-demo="${r}">${n}</button>`).join('')}</div></div><p class="caption" style="margin-top:18px">ข้อมูลทดลองเก็บในอุปกรณ์นี้ การเชื่อมคลังส่วนกลางอยู่ระหว่างติดตั้ง</p></section></div>`;}
const navs=[['home','ภาพรวม','◫'],['catalog','เบิกวัสดุ','＋'],['requests','คำขอของฉัน','▤'],['queue','จัดเตรียมและส่งมอบ','☷'],['stock','คลังวัสดุ','▦'],['po','จัดซื้อและรับเข้า','▱'],['reports','รายงานและบัญชีวัสดุ','▥'],['settings','ตั้งค่าและตรวจสอบ','⚙']];
function header(title,desc,actions=''){return `<div class="page-head"><div><p class="eyebrow">MATERIAL WORKSPACE</p><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;}
function canNav(id){return !(['stock','po','reports'].includes(id)&&!isMoney()||id==='queue'&&!['HEAD','OFFICER'].includes(actor.role)||id==='settings'&&!isAdmin());}
function render(){if(!actor){$('app').innerHTML=loginPage();return;}
 const d=draft(),pending=read('iv-pending-'+actor.user_id,null),items=Object.values(d.items).filter(v=>v>0).length;
 $('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">ว</span><div><strong>ระบบเบิกวัสดุ</strong><small>ศาลจังหวัดลพบุรี</small></div></div><nav class="nav" aria-label="เมนูหลัก">${navs.filter(([id])=>canNav(id)).map(([id,n,icon])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span>${icon}</span>${n}${id==='catalog'&&items?' · '+items:''}</button>`).join('')}</nav><div class="sidebar-foot"><strong>${esc(actor.full_name)}</strong>${roleNames[actor.role]}<br>${mode==='live'?'คลังทดสอบส่วนกลาง':'ข้อมูลตัวอย่างในอุปกรณ์นี้'}</div></aside><div><header class="topbar"><div class="muted">${new Intl.DateTimeFormat('th-TH',{dateStyle:'long'}).format(new Date())}</div><div class="account"><span class="avatar">${esc(actor.full_name[0])}</span><div><strong>${esc(actor.full_name)}</strong><small>${roleNames[actor.role]}</small></div><div class="actions"><button class="plain" data-refresh aria-label="โหลดข้อมูลล่าสุด">↻</button><button class="outline small" data-logout>ออกจากระบบ</button></div></div></header><div class="mode">● ${mode==='live'?'คลังทดสอบส่วนกลาง · บันทึกจริงในชีตทดสอบ':'โหมดทดลอง · ข้อมูลสังเคราะห์บันทึกในอุปกรณ์นี้'} · ${mode==='live'?'แยกจากคลังใช้งานจริง':'ลองเบิกแล้วสลับมุมมองเจ้าหน้าที่เพื่อส่งมอบได้'}</div>${pending&&mode==='live'?'<div class="pending">มีรายการที่ยังรอผลยืนยัน <button class="outline small" data-retry>ตรวจ/ส่งรายการเดิม</button></div>':''}<main class="body">${pageContent()}<footer><span>ระบบเบิกวัสดุ · ศาลจังหวัดลพบุรี</span><span>รุ่นทดลอง 0.2 · ${mode==='live'?'Google Sheets':'ข้อมูลตัวอย่าง'} · ยังไม่เปิดคลังจริง</span></footer></main></div></div>`;
}
function pageContent(){return ({home:home,catalog:catalog,cart:cart,requests:requests,queue:queue,stock:stock,po:purchase,reports:reports,settings:settings}[page]||home)();}
function home(){const st=view.stats,mine=view.requests.filter(r=>r.user_id===actor.user_id),recent=view.requests.slice(-4).reverse(),max=Math.max(1,...st.byDepartment.map(x=>x.requestCount));return header('งานวัสดุวันนี้','ภาพรวมคำขอและความพร้อมของคลัง')+`<section class="hero"><div><p class="eyebrow" style="color:#dbbe7f">เริ่มงานได้ในไม่กี่ขั้นตอน</p><h2>${isOfficer()?'เตรียมของพร้อม ส่งมอบเมื่อรับจริง':'เลือกวัสดุ แล้วให้ระบบจัดการต่อ'}</h2><p>${isOfficer()?'สถานะพร้อมรับยังไม่ตัดยอด ยืนยันส่งมอบพร้อมชื่อผู้รับจึงบันทึกจ่าย':'ไม่ต้องกรอกชื่อหรือส่วนงานซ้ำ ร่างของคุณบันทึกให้อัตโนมัติ'}</p></div><button data-page="${isOfficer()?'queue':'catalog'}">${isOfficer()?'เปิดคิวส่งมอบ':'เริ่มเบิกวัสดุ'} →</button></section><div class="stats"><article class="stat"><span>คำขอรอดำเนินการ</span><strong>${st.pendingCount}</strong><small>ใบจากทุกส่วนงาน</small></article><article class="stat"><span>เตรียมพร้อมรับ</span><strong>${st.readyCount}</strong><small>ยังไม่ตัดยอดคลัง</small></article><article class="stat"><span>วัสดุใกล้หมด</span><strong>${st.lowStock}</strong><small>รายการที่ควรตรวจเติม</small></article><article class="stat"><span>${isMoney()?'มูลค่าคงคลัง':'คำขอที่จ่ายแล้ว'}</span><strong>${isMoney()?money(st.stockValue):st.issuedCount}</strong><small>${isMoney()?'บาท · ต้นทุนข้อมูลทดสอบ':'ใบในชุดข้อมูลนี้'}</small></article></div><div class="grid"><section class="panel"><div class="section-head"><h2>คำขอล่าสุด</h2><button class="plain" data-page="requests">ดูทั้งหมด →</button></div>${recent.map(r=>`<div class="list-row"><div><h3>${esc(r.req_no)}</h3><small>${esc(r.requester_name_at_submit)} · ${date(r.created_at)}</small></div>${badge(r.status)}</div>`).join('')||'<div class="empty">ยังไม่มีคำขอ เริ่มเบิกวัสดุได้ทันที</div>'}</section><section class="panel"><div class="section-head"><h2>คำขอตามส่วนงาน</h2><small>จำนวนใบ</small></div>${st.byDepartment.map(d=>`<div class="bar-row"><span>${esc(d.name)}</span><div class="progress"><i style="width:${d.requestCount/max*100}%"></i></div><strong>${d.requestCount}</strong></div>`).join('')}<p class="caption">สรุปเฉพาะปริมาณ ไม่แสดงข้อมูลบุคคลข้ามส่วนงาน</p></section></div><section class="panel"><div class="section-head"><h2>เริ่มจากรายการใช้บ่อย</h2><button class="plain" data-page="catalog">เลือกวัสดุ →</button></div>${frequent(mine).map(m=>`<div class="list-row"><div><h3>${esc(m.name)}</h3><small>${esc(m.code)} · พร้อมเบิก ${num(m.available)} ${esc(unit(m.unit_id))}</small></div><button class="outline small" data-add="${m.mat_id}">เลือก</button></div>`).join('')}</section>`;}
function frequent(reqs){const counts={};for(const r of reqs)for(const l of r.lines)counts[l.mat_id]=(counts[l.mat_id]||0)+1;return view.materials.filter(m=>m.active).slice().sort((a,b)=>(counts[b.mat_id]||0)-(counts[a.mat_id]||0)).slice(0,3);}
function catalogRows(){return view.materials.filter(m=>m.active&&(!category||m.cat_id===category)&&(`${m.code} ${m.name}`.toLowerCase().includes(search.toLowerCase()))).map(m=>`<article class="material"><div class="material-head"><div class="mat-icon">▤</div><span class="badge ${m.available===0?'red':m.available<=m.reorder_point?'warn':''}">${m.available===0?'หมด':m.available<=m.reorder_point?'ใกล้หมด':'พร้อมเบิก'}</span></div><h3>${esc(m.name)}</h3><small>${esc(m.code)} · ${esc(view.categories.find(c=>c.cat_id===m.cat_id)?.name)}</small><div class="stock"><span>พร้อมเบิก <strong>${num(m.available)}</strong> ${esc(unit(m.unit_id))}</span><span class="muted">สูงสุด ${m.max_per_request}/ครั้ง</span></div><div class="choose"><input aria-label="จำนวน ${esc(m.name)}" id="pick-${m.mat_id}" type="number" min="1" max="${Math.min(m.available,m.max_per_request)}" step="1" value="1"><button class="outline" data-pick="${m.mat_id}" ${m.available<=0?'disabled':''}>เพิ่มในตะกร้า</button></div></article>`).join('')||'<div class="empty">ไม่พบวัสดุที่ค้นหา</div>';}
function cartBar(){const d=draft(),count=Object.values(d.items).filter(n=>n>0).length;return count?`<div class="cart-bar"><div><strong>ตะกร้าของคุณ · ${count} รายการ</strong><small> · บันทึกร่างอัตโนมัติ</small></div><button data-page="cart">ตรวจตะกร้า →</button></div>`:'';}
function catalog(){return header('เลือกวัสดุที่ต้องการ','ค้นหา เลือกจำนวน แล้วตรวจตะกร้าก่อนส่งคำขอ')+`<div class="filters"><input id="search" aria-label="ค้นหาวัสดุ" placeholder="ค้นหาชื่อหรือรหัสวัสดุ" value="${esc(search)}"><select id="category" aria-label="หมวดวัสดุ"><option value="">ทุกหมวด</option>${view.categories.map(c=>`<option value="${c.cat_id}" ${category===c.cat_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="catalog-grid" id="catalog-rows">${catalogRows()}</div><div id="cart-bar">${cartBar()}</div>`;}
function cart(){const d=draft(),lines=Object.entries(d.items).filter(([id,n])=>n>0&&mat(id));return header('ตรวจตะกร้าก่อนส่ง','ร่างยังไม่จองยอดและยังไม่ออกเลขเอกสาร')+`<section class="panel"><p><strong>${esc(actor.full_name)}</strong> · ${esc(view.departments.find(d=>d.dept_id===actor.dept_id)?.name)}</p><div class="table-wrap"><table><thead><tr><th>วัสดุ</th><th>จำนวน</th><th>หน่วย</th><th></th></tr></thead><tbody>${lines.map(([id,n])=>`<tr><td><strong>${esc(mat(id).name)}</strong><small>พร้อมเบิก ${num(mat(id).available)}</small></td><td><input aria-label="จำนวน ${esc(mat(id).name)}" style="width:100px" data-draft-qty="${id}" type="number" min="1" max="${Math.min(mat(id).available,mat(id).max_per_request)}" value="${n}"></td><td>${esc(unit(mat(id).unit_id))}</td><td><button class="plain" data-remove="${id}">ลบ</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ตะกร้ายังว่าง</td></tr>'}</tbody></table></div><label style="margin-top:20px">วัตถุประสงค์ (ถ้ามี)<textarea id="purpose" rows="3" maxlength="500">${esc(d.purpose)}</textarea></label><p class="caption">บันทึกร่างอัตโนมัติในอุปกรณ์นี้ แยกตามบัญชี</p><div class="actions"><button data-write data-submit-request ${!lines.length?'disabled':''}>ส่งคำขอเบิก</button><button class="outline" data-page="catalog">เลือกเพิ่ม</button></div></section>`;}
function requestCard(r,inQueue=false){const pending=C.pending.includes(r.status);return `<article class="panel"><div class="section-head"><div><h2>${esc(r.req_no)}</h2><small>${esc(r.requester_name_at_submit)} · ${esc(r.dept_name_at_submit)}</small></div>${badge(r.status)}</div><div class="table-wrap"><table><thead><tr><th>วัสดุ</th><th class="num">ขอ</th><th class="num">เตรียม</th><th class="num">ได้รับ</th></tr></thead><tbody>${r.lines.map(l=>`<tr><td>${esc(mat(l.mat_id)?.name||l.mat_id)}<small>${esc(l.unit_name_snapshot)}</small></td><td class="num">${num(l.qty_req)}</td><td class="num">${num(l.qty_ready)}</td><td class="num">${num(l.qty_issued)}</td></tr>`).join('')}</tbody></table></div><div class="timeline"><span>ยื่น ${date(r.created_at)}</span>${r.approved_at?`<span>อนุมัติ ${date(r.approved_at)}</span>`:''}${r.ready_at?`<span>พร้อมรับ ${date(r.ready_at)}</span>`:''}${r.issued_at?`<span>ส่งมอบ ${date(r.issued_at)} · ผู้รับ ${esc(r.receiver_name)}</span>`:''}</div>${r.reason?`<p class="caption">เหตุผล: ${esc(r.reason)}</p>`:''}<div class="actions">${inQueue&&r.status==='PENDING'?`<button data-approve="${r.req_id}">พิจารณาอนุมัติ</button><button class="danger" data-reject="${r.req_id}">ไม่อนุมัติ</button>`:''}${inQueue&&isOfficer()&&r.status==='PREPARING'?`<button data-ready="${r.req_id}">จัดเตรียมพร้อมรับ</button>`:''}${inQueue&&isOfficer()&&r.status==='READY'?`<button data-issue="${r.req_id}">ยืนยันส่งมอบ</button>`:''}${pending&&(r.user_id===actor.user_id||isOfficer())?`<button class="danger" data-cancel="${r.req_id}">ยกเลิกคำขอ</button>`:''}${!pending?`<button class="outline" data-repeat="${r.req_id}">เบิกซ้ำเป็นร่าง</button>`:''}<button class="plain" data-print="${r.req_id}">พิมพ์ใบเบิก</button>${isOfficer()&&r.status==='ISSUED'?`<button class="outline" data-return="${r.req_id}">รับคืนวัสดุ</button>`:''}</div></article>`;}
function requests(){const rows=view.requests.filter(r=>r.user_id===actor.user_id);return header('คำขอของฉัน','ติดตามสถานะและจำนวนที่ได้รับจริง')+(rows.slice().reverse().map(r=>requestCard(r)).join('')||'<section class="panel empty">ยังไม่มีคำขอของคุณ</section>');}
function queue(){const rows=view.requests.filter(r=>C.pending.includes(r.status));return header(actor.role==='HEAD'?'คำขอรอพิจารณา':'จัดเตรียมและส่งมอบ','พร้อมรับยังไม่ตัดยอด · ส่งมอบจริงจึงบันทึกจ่าย')+(rows.map(r=>requestCard(r,true)).join('')||'<section class="panel empty">ไม่มีคำขอค้างในขณะนี้</section>');}
function stock(){return header('คลังวัสดุ','คงเหลือ ยอดจอง และยอดพร้อมเบิกจากบัญชีความเคลื่อนไหว',isOfficer()?'<button data-new-material>＋ เพิ่มวัสดุ</button><button class="outline" data-import-materials>นำเข้าข้อความ</button><button class="outline" data-receive>รับเข้า</button>':'')+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>รหัส / รายการ</th><th>หน่วย</th><th class="num">คงเหลือ</th><th class="num">จอง</th><th class="num">พร้อมเบิก</th><th class="num">ต้นทุนเฉลี่ย</th><th></th></tr></thead><tbody>${view.materials.map(m=>`<tr><td><strong>${esc(m.name)}</strong><small>${esc(m.code)} ${!m.active?'· ปิดใช้งาน':''}</small></td><td>${esc(unit(m.unit_id))}</td><td class="num">${num(m.balance)}</td><td class="num">${num(m.reserved)}</td><td class="num">${num(m.available)}</td><td class="num">${money(m.avg_cost)}</td><td>${isOfficer()?`<div class="actions"><button class="outline small" data-edit-material="${m.mat_id}">แก้ไข</button><button class="outline small" data-adjust="${m.mat_id}">ตรวจนับ</button></div>`:''}</td></tr>`).join('')}</tbody></table></div></section>`;}
function purchase(){return header('จัดซื้อและรับเข้า','รับบางส่วนได้ ปิดรับไม่ครบพร้อมเหตุผล และเก็บประวัติครบ',isOfficer()?'<button data-new-po>＋ สร้างใบสั่งซื้อ</button><button class="outline" data-receive>รับเข้าไม่มี PO</button>':'')+`<section class="panel"><div class="section-head"><h2>ใบสั่งซื้อ</h2></div><div class="table-wrap"><table><thead><tr><th>เลขใบสั่งซื้อ</th><th>ผู้จำหน่าย</th><th>สถานะ</th><th class="num">มูลค่าสั่ง</th><th></th></tr></thead><tbody>${view.purchaseOrders.slice().reverse().map(p=>`<tr><td><strong>${esc(p.po_no||'ร่างใบสั่งซื้อ')}</strong><small>${p.lines.length} รายการ · ${p.close_reason?esc(p.close_reason):esc(p.note)}</small></td><td>${esc(view.suppliers.find(s=>s.sup_id===p.sup_id)?.name)}</td><td>${badge(p.status)}</td><td class="num">${money(p.total)}</td><td>${isOfficer()?`<div class="actions">${p.status==='DRAFT'?`<button class="small" data-order-po="${p.po_id}">ยืนยันสั่งซื้อ</button>`:''}${['ORDERED','PARTIAL'].includes(p.status)?`<button class="small" data-receive-po="${p.po_id}">รับเข้า</button>`:''}${p.status==='PARTIAL'?`<button class="outline small" data-close-po="${p.po_id}">ปิดรับไม่ครบ</button>`:''}${['DRAFT','ORDERED'].includes(p.status)?`<button class="danger small" data-cancel-po="${p.po_id}">ยกเลิก</button>`:''}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีใบสั่งซื้อ</td></tr>'}</tbody></table></div></section><section class="panel"><div class="section-head"><h2>ผู้จำหน่าย</h2>${isOfficer()?'<button class="outline small" data-new-supplier>＋ เพิ่มผู้จำหน่าย</button>':''}</div>${view.suppliers.map(s=>`<div class="list-row"><div><strong>${esc(s.name)}</strong><small>${esc(s.phone||s.address||'ยังไม่มีข้อมูลติดต่อ')}</small></div>${s.active?'<span class="badge">ใช้งาน</span>':'<span class="badge neutral">ปิดใช้งาน</span>'}</div>`).join('')}</section>`;}
function reports(){return header('รายงานและบัญชีวัสดุ','ตรวจสอบรับ–จ่ายย้อนหลังจากรายการที่บันทึกจริง', '<button class="outline" data-export-ledger>ส่งออก CSV</button>')+`<div class="stats"><article class="stat"><span>มูลค่าคงคลัง</span><strong>${money(view.stats.stockValue)}</strong><small>บาท</small></article><article class="stat"><span>มูลค่าจ่ายสะสม</span><strong>${money(view.stats.issueValue)}</strong><small>บาท</small></article><article class="stat"><span>รายการความเคลื่อนไหว</span><strong>${view.ledger.length}</strong><small>แถว</small></article><article class="stat"><span>ผลกระทบยอด</span><strong>${view.reconciliation.ok?'ตรงกัน':'พบต่าง'}</strong><small>${view.reconciliation.issues.length} จุดคลาดเคลื่อน</small></article></div><section class="panel"><div class="section-head"><h2>บัญชีรับ–จ่ายวัสดุ</h2><small>ล่าสุดก่อน</small></div><div class="table-wrap"><table><thead><tr><th>วันที่ / เอกสาร</th><th>วัสดุ</th><th>ประเภท</th><th class="num">รับ</th><th class="num">จ่าย</th><th class="num">ต้นทุน</th><th class="num">คงเหลือ</th></tr></thead><tbody>${view.ledger.slice().reverse().map(l=>`<tr><td>${date(l.ts)}<small>${esc(l.ref_no)}</small></td><td>${esc(mat(l.mat_id)?.name)}</td><td>${({OPEN:'ยกมา',RECEIVE:'รับเข้า',ISSUE:'จ่าย',RETURN:'รับคืน',ADJUST:'ปรับยอด'})[l.type]}</td><td class="num">${num(l.qty_in)}</td><td class="num">${num(l.qty_out)}</td><td class="num">${money(l.unit_cost)}</td><td class="num">${num(l.balance_after)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function settings(){return header('ตั้งค่าและตรวจสอบ','การตั้งค่ารุ่นทดสอบและการรักษาความถูกต้องของข้อมูล')+`<section class="panel"><h2>การทำงาน</h2><p class="notice">วิธีต้นทุนข้อมูลตัวอย่าง: ถัวเฉลี่ยถ่วงน้ำหนัก · ก่อนเริ่มคลังจริงต้องเลือกและรับรองวิธีต้นทุนกับยอดยกมา รุ่นนี้ยังไม่เปิด FIFO</p><div class="actions"><button class="outline" data-toggle-approval>${view.meta.approvalEnabled?'ปิด':'เปิด'}ขั้นอนุมัติคำขอ</button><button class="outline" data-toggle-requests>${view.meta.acceptingRequests?'พัก':'เปิด'}รับคำขอใหม่</button><button class="outline" data-reconcile>ตรวจยอด</button></div></section><section class="panel"><h2>สำรองและทดสอบกู้คืน</h2><p class="muted">${mode==='live'?'สร้างสำเนาชีตส่วนตัว และทดสอบกู้คืนเป็นไฟล์แยกโดยไม่ทับคลังปัจจุบัน':'โหมดทดลองจะเก็บสำเนาในอุปกรณ์นี้ การสำรองชีตจริงใช้คลังทดสอบส่วนกลาง'}</p><div class="actions"><button data-backup>สำรองทันที</button><button class="outline" data-restore>ทดสอบกู้คืนเป็นสำเนา</button></div><div id="backup-result"></div></section><section class="panel"><h2>รายการบันทึกค้าง</h2>${(view.operations||[]).filter(x=>x.status!=='DONE').map(o=>`<div class="list-row"><div><strong>${esc(o.action)}</strong><small>${esc(o.uuid)} · ${esc(o.status)}</small></div><button class="outline small" data-repair="${esc(o.uuid)}">ตรวจและซ่อม</button></div>`).join('')||'<p class="muted">ไม่มีรายการเขียนค้างที่พบในชุดข้อมูลนี้</p>'}</section><section class="panel"><h2>ประวัติการดำเนินการ</h2><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ดำเนินการ</th><th>เหตุการณ์</th><th>อ้างอิง</th></tr></thead><tbody>${view.audit.slice(0,50).map(a=>`<tr><td>${date(a.ts)}</td><td>${esc(a.user_id)}</td><td>${esc(a.action)}</td><td>${esc(a.entity_id)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div></section>`;}
function modal(title,body,handler,confirm='บันทึก'){dialogHandler=handler;$('modal').innerHTML=`<header><h2>${title}</h2><button class="plain" data-close-modal aria-label="ปิดหน้าต่าง">✕</button></header><form id="modal-form">${body}<div id="modal-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" class="outline" data-close-modal>ยกเลิก</button><button id="confirm-modal">${confirm}</button></div></form>`;$('modal').showModal();}
function dataForm(form){return Object.fromEntries(new FormData(form));}
function lineInputs(lines,quantityField='qty',prices=false){return lines.map(l=>`<div class="line-form" data-row><label>วัสดุ<select name="mat_id" required ${l.lock?'disabled':''}>${view.materials.filter(m=>m.active).map(m=>`<option value="${m.mat_id}" ${m.mat_id===l.mat_id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>${l.lock?`<input type="hidden" name="mat_id" value="${l.mat_id}">`:''}</label><label>จำนวน<input name="${quantityField}" type="number" min="${l.zero?0:0.001}" step="0.001" ${l.max!==undefined?`max="${l.max}"`:''} value="${l.qty??1}" required></label>${prices?`<label>หน่วย<input name="unit_name" list="unit-options" value="${esc(l.unit_name||unit(l.unit_id||'U1'))}" required></label><label>ราคา/หน่วย<input name="unit_price" type="number" min="0" step="0.01" value="${l.unit_price??0}" required></label>`:'<span></span><span></span>'}${l.lock?'<span></span>':'<button type="button" class="remove" data-remove-line aria-label="ลบรายการ">×</button>'}</div>`).join('');}
function unitList(){return `<datalist id="unit-options">${view.units.map(u=>`<option value="${esc(u.name)}">${esc(u.aliases||'')}</option>`).join('')}</datalist>`;}
function collectLines(form,withPrice=false){return [...form.querySelectorAll('[data-row]')].map(r=>{const m=r.querySelector('[name=mat_id]:not(:disabled)'),qty=Number(r.querySelector('[name=qty]').value),out={mat_id:m.value,qty};if(withPrice){const name=r.querySelector('[name=unit_name]').value.trim(),u=view.units.find(u=>u.name===name||String(u.aliases).split(',').includes(name));if(!u)throw Error('กรุณาเลือกหน่วยจากรายการ');out.unit_id=u.unit_id;out.unit_price=Number(r.querySelector('[name=unit_price]').value);}return out;});}
function requestModal(id,action){const r=view.requests.find(x=>x.req_id===id),title={ready:'จัดเตรียมพร้อมรับ',issue:'ยืนยันส่งมอบจริง',approve:'อนุมัติคำขอ',return:'รับคืนวัสดุ'}[action];modal(title,`<p><strong>${esc(r.req_no)}</strong> · ${esc(r.requester_name_at_submit)}</p><p class="notice">${action==='ready'?'บันทึกพร้อมรับโดยยังไม่ตัดยอด':action==='issue'?'ส่งมอบบางส่วนแล้วปิดใบ คืนยอดจองส่วนที่เหลือ':'ตรวจจำนวนทุกรายการก่อนบันทึก'}</p>${lineInputs(r.lines.map(l=>({mat_id:l.mat_id,qty:action==='issue'?l.qty_ready:action==='return'?0:(l.qty_approved===''?l.qty_req:l.qty_approved),max:action==='issue'?l.qty_ready:action==='return'?l.qty_issued:l.qty_req,zero:true,lock:true})))}${action==='issue'?'<label>ชื่อ–สกุลผู้รับจริง<input name="receiver_name" maxlength="150" required></label>':''}${action==='return'?'<label>เหตุผลรับคืน<textarea name="reason" required></textarea></label>':''}`,async form=>{const d={req_id:id,lines:collectLines(form),...dataForm(form)};d.lines=collectLines(form);if(action==='return')d.lines=d.lines.filter(l=>l.qty>0);await mutate(action==='return'?'stock.return':'request.'+action,d);},action==='issue'?'ยืนยันส่งมอบและปิดใบ':'บันทึก');}
function reasonModal(title,action,data){modal(title,'<label>เหตุผล<textarea name="reason" required maxlength="500" rows="3"></textarea></label>',async f=>mutate(action,{...data,reason:dataForm(f).reason}));}
function receiveModal(poId){const po=view.purchaseOrders?.find(p=>p.po_id===poId),lines=po?po.lines.filter(l=>l.ordered_base_qty>l.received_base_qty+l.cancelled_base_qty).map(l=>({mat_id:l.mat_id,qty:(l.ordered_base_qty-l.received_base_qty-l.cancelled_base_qty)/l.factor_to_base_snapshot,unit_id:l.purchase_unit_id,unit_name:l.purchase_unit_name_snapshot,unit_price:l.unit_price,lock:true})):[];modal(po?'รับเข้าตามใบสั่งซื้อ':'รับเข้าวัสดุ',`${po?`<p>${esc(po.po_no)} · รับได้ไม่เกินจำนวนค้าง</p>`:''}<div class="form-grid"><label>เลขที่ใบส่งของ/ใบแจ้งหนี้<input name="invoice_no" maxlength="100"></label><label>ผู้จำหน่าย<select name="sup_id"><option value="">ไม่ระบุ</option>${view.suppliers.filter(s=>s.active).map(s=>`<option value="${s.sup_id}" ${po?.sup_id===s.sup_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div><div id="entry-lines">${lineInputs(lines.length?lines:[{mat_id:'PEN',qty:1,unit_id:'U1',unit_price:5}], 'qty',true)}</div>${!po?'<button type="button" class="outline small" data-add-line>＋ เพิ่มรายการ</button>':''}${unitList()}<p class="notice">เลือกหน่วยซื้อได้ ระบบแปลงเป็นหน่วยหลักตามอัตราของวัสดุแต่ละรายการ</p>`,async f=>mutate('stock.receive',{...dataForm(f),po_id:poId||'',lines:collectLines(f,true)}),'ยืนยันรับเข้า');}
function materialModal(id){const m=mat(id)||{},conv=view.conversions.find(c=>c.mat_id===id);modal(id?'แก้ไขวัสดุ':'เพิ่มวัสดุ',`<div class="form-grid"><label>รหัสวัสดุ<input name="code" value="${esc(m.code||'')}" required maxlength="50"></label><label>ชื่อวัสดุ<input name="name" value="${esc(m.name||'')}" required maxlength="150"></label><label>หมวด<select name="cat_id">${view.categories.map(c=>`<option value="${c.cat_id}" ${m.cat_id===c.cat_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>หน่วยหลัก<input name="base_unit" list="unit-options" value="${esc(unit(m.unit_id||'U0'))}" required></label><label>จุดสั่งซื้อขั้นต่ำ<input name="reorder_point" type="number" min="0" step="0.001" value="${m.reorder_point||0}"></label><label>สูงสุดต่อการเบิก<input name="max_per_request" type="number" min="0.001" step="0.001" value="${m.max_per_request||100}"></label><label>หน่วยซื้อเพิ่มเติม (ถ้ามี)<input name="purchase_unit" list="unit-options" value="${conv?esc(unit(conv.unit_id)):''}"></label><label>1 หน่วยซื้อ = กี่หน่วยหลัก<input name="factor" type="number" min="0.001" step="0.001" value="${conv?.factor_to_base||1}"></label><label>สถานะ<select name="active"><option value="true">ใช้งาน</option><option value="false" ${m.active===false?'selected':''}>ปิดใช้งาน</option></select></label></div>${unitList()}<p class="caption">ไม่แก้ยอดคงเหลือจากหน้านี้ การตั้งยอดใช้รับเข้าหรือปรับยอดพร้อมเหตุผล</p>`,async f=>{const d=dataForm(f),u=view.units.find(x=>x.name===d.base_unit),pu=d.purchase_unit?view.units.find(x=>x.name===d.purchase_unit):null;if(!u||d.purchase_unit&&!pu)throw Error('กรุณาเลือกหน่วยจากรายการ');await mutate('material.save',{mat_id:id||'',code:d.code,name:d.name,cat_id:d.cat_id,unit_id:u.unit_id,reorder_point:Number(d.reorder_point),max_per_request:Number(d.max_per_request),active:d.active==='true',conversions:pu?[{unit_id:pu.unit_id,factor_to_base:Number(d.factor)}]:[]});});}
function printRequest(id){const r=view.requests.find(x=>x.req_id===id);$('print-page')?.remove();const node=document.createElement('section');node.id='print-page';node.className='print-only';node.innerHTML=`<h1>ใบเบิกวัสดุ</h1><p style="text-align:center">ศาลจังหวัดลพบุรี · ${esc(r.req_no)}</p><p>ผู้ขอเบิก ${esc(r.requester_name_at_submit)} &nbsp; ตำแหน่ง ${esc(r.requester_position_at_submit)}</p><p>ส่วนงาน ${esc(r.dept_name_at_submit)} &nbsp; วันที่ ${date(r.created_at)}</p><p>วัตถุประสงค์ ${esc(r.purpose||'—')}</p><table><thead><tr><th>ลำดับ</th><th>รายการ</th><th>หน่วย</th><th>จำนวนขอ</th><th>จ่ายจริง</th></tr></thead><tbody>${r.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(mat(l.mat_id)?.name||l.mat_id)}</td><td>${esc(l.unit_name_snapshot)}</td><td>${num(l.qty_req)}</td><td>${num(l.qty_issued)}</td></tr>`).join('')}</tbody></table><div class="signatures"><span>ผู้เบิก __________________<br>(${esc(r.requester_name_at_submit)})</span><span>หัวหน้าส่วน __________________<br>(${esc(r.head_name_at_submit)})</span><span>ผู้จ่าย __________________<br>(${esc(r.issuer_name_at_issue)})</span></div><p class="caption" style="margin-top:40px">ผู้รับวัสดุ ${esc(r.receiver_name||'__________________')} · เอกสารข้อมูลทดสอบ</p>`;document.body.append(node);window.print();}
function csv(rows,name){const cell=v=>{let s=String(v??'');if(typeof v==='string'&&/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);}
async function onClick(e){const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.demo){mode='demo';actor=C.getActor(db,'TEST_'+b.dataset.demo);page='home';await refresh();return;}
 if(b.hasAttribute('data-logout')){if(mode==='live')try{await post('logout');}catch{}sessionStorage.removeItem('iv-token');actor=null;view=null;mode='';render();return;}
 if(b.hasAttribute('data-refresh')){await refresh();toast('โหลดข้อมูลล่าสุดแล้ว');return;}
 if(b.dataset.page){if(b.dataset.page!=='cart'&&!canNav(b.dataset.page))return;page=b.dataset.page;render();window.scrollTo(0,0);return;}
 if(b.hasAttribute('data-close-modal')){$('modal').close();return;}
 if(b.dataset.pick||b.dataset.add){const id=b.dataset.pick||b.dataset.add,m=mat(id),n=b.dataset.pick?Number($('pick-'+id).value):1,d=draft(),qty=(d.items[id]||0)+n;if(!Number.isFinite(n)||n<=0||qty>Math.min(m.max_per_request,m.available))throw Error('จำนวนเกินยอดพร้อมเบิกหรือจำนวนสูงสุด');d.items[id]=qty;saveDraft(d);if(b.dataset.add)page='catalog';render();toast('เพิ่มในตะกร้าแล้ว');return;}
 if(b.dataset.remove){const d=draft();delete d.items[b.dataset.remove];saveDraft(d);render();return;}
 if(b.hasAttribute('data-submit-request')){const d=draft();modal('ส่งคำขอเบิก',`<p>ส่ง ${Object.values(d.items).filter(x=>x>0).length} รายการ เพื่อให้เจ้าหน้าที่จัดเตรียม</p><p class="notice">เมื่อระบบตอบรับสำเร็จจึงออกเลขเอกสารและจองยอด</p>`,async()=>{await mutate('request.submit',{purpose:d.purpose,lines:Object.entries(d.items).filter(([,qty])=>qty>0).map(([mat_id,qty])=>({mat_id,qty}))});saveDraft({items:{},purpose:''});page='requests';render();},'ยืนยันส่งคำขอ');return;}
 for(const action of ['ready','issue','approve','return'])if(b.dataset[action]){requestModal(b.dataset[action],action);return;}
 if(b.dataset.cancel){reasonModal('ยกเลิกคำขอ','request.cancel',{req_id:b.dataset.cancel});return;}
 if(b.dataset.reject){reasonModal('ไม่อนุมัติคำขอ','request.reject',{req_id:b.dataset.reject});return;}
 if(b.dataset.repeat){const r=view.requests.find(r=>r.req_id===b.dataset.repeat);modal('เบิกซ้ำเป็นร่าง','<p>คัดลอกรายการมาให้ตรวจใหม่ จะยังไม่จองยอดหรือส่งคำขอ</p>',async()=>{saveDraft({items:Object.fromEntries(r.lines.map(l=>[l.mat_id,l.qty_req])),purpose:r.purpose});page='cart';render();},'เปิดร่างให้ตรวจ');return;}
 if(b.dataset.print){printRequest(b.dataset.print);return;}
 if(b.hasAttribute('data-import-materials')){let preview=null;modal('นำเข้ารายการวัสดุ',`<p class="muted">วางข้อมูลจาก Excel หรือข้อความ 3 คอลัมน์: รหัส, ชื่อวัสดุ, หน่วยนับ (คั่นด้วยแท็บ) สูงสุดครั้งละ 25 รายการ</p><label>หมวดวัสดุ<select name="cat_id">${view.categories.map(c=>`<option value="${c.cat_id}">${esc(c.name)}</option>`).join('')}</select></label><label style="margin-top:15px">รายการวัสดุ<textarea name="raw" rows="7" required placeholder="01010&#9;ดินสอ&#9;ด้าม"></textarea></label><div id="import-preview"></div><p class="notice">ตรวจรายการในขั้นถัดไปก่อนบันทึก ไม่เปลี่ยนยอดคงเหลือ</p>`,async f=>{if(preview){await mutate('material.import',{rows:preview});return;}const d=dataForm(f),rows=d.raw.trim().split(/\r?\n/).map(line=>{const cells=line.split('\t').map(v=>v.trim());if(cells.length!==3)throw Error('ต้องมี 3 คอลัมน์คั่นด้วยแท็บในแต่ละบรรทัด');const u=view.units.find(u=>u.name===cells[2]||String(u.aliases).split(',').includes(cells[2]));if(!u)throw Error('ไม่พบหน่วย '+cells[2]+' กรุณาใช้หน่วยในรายการ');if(view.materials.some(m=>m.code===cells[0]))throw Error('รหัส '+cells[0]+' มีอยู่แล้ว');return {code:cells[0],name:cells[1],unit_id:u.unit_id,cat_id:d.cat_id,max_per_request:100,reorder_point:0};});if(rows.length>25)throw Error('นำเข้าครั้งละไม่เกิน 25 รายการ');if(new Set(rows.map(r=>r.code)).size!==rows.length)throw Error('มีรหัสซ้ำในรายการนำเข้า');preview=rows;$('import-preview').innerHTML=`<h3 style="margin-top:20px">ตรวจรายการก่อนบันทึก</h3><table><thead><tr><th>รหัส</th><th>ชื่อวัสดุ</th><th>หน่วย</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(unit(r.unit_id))}</td></tr>`).join('')}</tbody></table>`;f.querySelector('[name=raw]').readOnly=true;f.querySelector('[name=cat_id]').disabled=true;$('confirm-modal').textContent='ยืนยันนำเข้า '+rows.length+' รายการ';return 'keepOpen';},'ตรวจรายการ');return;}
 if(b.hasAttribute('data-new-material')||b.dataset.editMaterial){materialModal(b.dataset.editMaterial);return;}
 if(b.hasAttribute('data-receive')||b.dataset.receivePo){receiveModal(b.dataset.receivePo);return;}
 if(b.dataset.adjust){const m=mat(b.dataset.adjust);modal('ตรวจนับและปรับยอด',`<p><strong>${esc(m.name)}</strong> · ยอดระบบ ${num(m.balance)} ${esc(unit(m.unit_id))} · จอง ${num(m.reserved)}</p><div class="form-grid"><label>จำนวนตรวจนับจริง<input type="number" name="qty_counted" min="0" step="0.001" required value="${m.balance}"></label><label>ต้นทุนต่อหน่วยกรณีเพิ่ม<input type="number" name="unit_cost" min="0" step="0.01" required value="${m.avg_cost}"></label><label class="full">เหตุผล<textarea name="reason" required maxlength="500"></textarea></label></div>`,async f=>{const d=dataForm(f);await mutate('stock.adjust',{mat_id:m.mat_id,qty_counted:Number(d.qty_counted),unit_cost:Number(d.unit_cost),reason:d.reason});});return;}
 if(b.hasAttribute('data-new-supplier')){modal('เพิ่มผู้จำหน่าย','<div class="form-grid"><label>ชื่อผู้จำหน่าย<input name="name" required maxlength="150"></label><label>โทรศัพท์<input name="phone" maxlength="50"></label><label class="full">ที่อยู่<textarea name="address" maxlength="500"></textarea></label></div>',async f=>mutate('supplier.save',dataForm(f)));return;}
 if(b.hasAttribute('data-new-po')){modal('สร้างใบสั่งซื้อ',`<div class="form-grid"><label>ผู้จำหน่าย<select name="sup_id" required>${view.suppliers.filter(s=>s.active).map(s=>`<option value="${s.sup_id}">${esc(s.name)}</option>`).join('')}</select></label><label>กำหนดส่ง<input name="due_date" type="date"></label><label class="full">หมายเหตุ<input name="note" maxlength="500"></label></div><div id="entry-lines">${lineInputs([{mat_id:'PEN',qty:1,unit_id:'U1',unit_price:5}], 'qty',true)}</div><button type="button" class="outline small" data-add-line>＋ เพิ่มรายการ</button>${unitList()}`,async f=>mutate('po.create',{...dataForm(f),lines:collectLines(f,true)}),'สร้างร่างใบสั่งซื้อ');return;}
 if(b.hasAttribute('data-add-line')){$('entry-lines').insertAdjacentHTML('beforeend',lineInputs([{qty:1,unit_id:'U0',unit_price:0}], 'qty',true));return;}
 if(b.hasAttribute('data-remove-line')){b.closest('[data-row]').remove();return;}
 if(b.dataset.orderPo){modal('ยืนยันสั่งซื้อ','<p>ออกเลขใบสั่งซื้อและเริ่มติดตามการรับเข้า</p>',async()=>mutate('po.order',{po_id:b.dataset.orderPo}));return;}
 if(b.dataset.closePo){reasonModal('ปิดรับไม่ครบ','po.closeShort',{po_id:b.dataset.closePo});return;}
 if(b.dataset.cancelPo){reasonModal('ยกเลิกใบสั่งซื้อ','po.cancel',{po_id:b.dataset.cancelPo});return;}
 if(b.hasAttribute('data-toggle-approval')){await mutate('config.save',{approvalEnabled:!view.meta.approvalEnabled});toast('บันทึกการตั้งค่าแล้ว');return;}
 if(b.hasAttribute('data-toggle-requests')){await mutate('config.save',{acceptingRequests:!view.meta.acceptingRequests});return;}
 if(b.hasAttribute('data-reconcile')){const check=mode==='live'?await post('system.reconcile'):C.check(db);toast(check.ok?'ยอดจริงและยอดจองตรงกับบัญชีแล้ว':'พบความคลาดเคลื่อน '+check.issues.length+' จุด');return;}
 if(b.hasAttribute('data-backup')){setBusy(true);try{const r=mode==='live'?await post('system.backup',{},crypto.randomUUID()):(localStorage.setItem('iv-demo-backup',JSON.stringify(db)),{local:true});$('backup-result').innerHTML=r.url?`<p class="notice">สำรองแล้ว <a target="_blank" rel="noopener" href="${esc(r.url)}">เปิดสำเนา</a></p>`:'<p class="notice">สำรองข้อมูลตัวอย่างในอุปกรณ์นี้แล้ว</p>';}finally{setBusy(false);}return;}
 if(b.hasAttribute('data-restore')){setBusy(true);try{let r;if(mode==='live')r=await post('system.restoreCheck');else{const snap=read('iv-demo-backup',null);if(!snap)throw Error('กรุณาสำรองก่อน');const restored=C.copy(snap);r={equalToBackup:JSON.stringify(restored)===JSON.stringify(snap),reconciliation:C.check(restored)};}$('backup-result').innerHTML=`<p class="notice">${r.equalToBackup&&r.reconciliation.ok?'สำเนากู้คืนตรงกับข้อมูลสำรอง และยอดกระทบตรงกัน':'พบความต่าง ต้องตรวจสอบ'} ${r.url?`<a target="_blank" rel="noopener" href="${esc(r.url)}">เปิดสำเนากู้คืน</a>`:''}<br>คลังปัจจุบันไม่ได้ถูกเขียนทับ</p>`;}finally{setBusy(false);}return;}
 if(b.dataset.repair){reasonModal('ซ่อมรายการเขียนค้าง','system.repair',{uuid:b.dataset.repair});return;}
 if(b.hasAttribute('data-export-ledger')){csv([['วันที่','เอกสาร','วัสดุ','ประเภท','รับ','จ่าย','ต้นทุน','คงเหลือ'],...view.ledger.map(l=>[date(l.ts),l.ref_no,mat(l.mat_id)?.name,l.type,l.qty_in,l.qty_out,l.unit_cost,l.balance_after])],'inventory-ledger-test.csv');return;}
 if(b.hasAttribute('data-retry')){const op=read('iv-pending-'+actor.user_id,null);if(op)await mutate(op.action,op.data,op);toast('ตรวจรายการเดิมแล้ว');return;}
}catch(err){toast(message(err));}}
document.addEventListener('click',onClick);
document.addEventListener('submit',async e=>{const form=e.target;if(!['login-form','live-form','modal-form'].includes(form.id))return;e.preventDefault();if(busy)return;try{
 if(form.id==='modal-form'){const keep=await dialogHandler(form);if(keep==='keepOpen')return;$('modal').close();toast('บันทึกสำเร็จแล้ว');return;}
 if(form.id==='login-form'){form.querySelector('[name=pin]').value='';throw Error('IDENTITY_INTEGRATION_NOT_CONFIGURED');}
 if(form.id==='live-form'){const d=dataForm(form);setBusy(true);try{const out=await post('loginTest',d);form.querySelector('[name=key]').value='';sessionStorage.setItem('iv-token',out.token);mode='live';actor=out.actor;page='home';await refresh();}finally{form.querySelector('[name=key]')&&(form.querySelector('[name=key]').value='');setBusy(false);}}
}catch(err){if(form.id==='modal-form')$('modal-error').textContent=message(err);else toast(message(err));}});
document.addEventListener('input',e=>{if(!actor)return;const el=e.target;if(el.id==='search'){search=el.value;$('catalog-rows').innerHTML=catalogRows();}if(el.id==='purpose'){const d=draft();d.purpose=el.value;saveDraft(d);}if(el.dataset.draftQty){const n=Number(el.value);if(n>0&&Number.isFinite(n)){const d=draft();d.items[el.dataset.draftQty]=n;saveDraft(d);}}});
document.addEventListener('change',e=>{if(e.target.id==='category'){category=e.target.value;$('catalog-rows').innerHTML=catalogRows();}});
$('modal').addEventListener('close',()=>{dialogHandler=null;});
render();
</script></body></html>
