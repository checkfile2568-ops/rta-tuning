<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chatbot ศูนย์ข้อมูล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff8fa8;--blue:#65b9f3;--ink:#24364b;--muted:#8090a2}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Prompt,sans-serif;background:#f8fbff}
#splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#fff0f4 0%,#fbfdff 50%,#edf8ff 100%);transition:opacity .35s ease,visibility .35s ease}
.card{width:min(92vw,390px);padding:44px 28px;text-align:center;background:#fff;border:1px solid #e7eef5;border-radius:28px;box-shadow:0 26px 64px rgba(65,91,116,.13)}
.icon{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff0f4,#eef8ff);font-size:34px}
h1{margin:0;color:var(--ink);font-size:1.45rem}h1 span{color:var(--pink)}
.sub{margin-top:8px;color:#58aee8;font-size:.86rem}.status{margin:26px 0 12px;color:#607286;font-size:.87rem}
.bar{height:8px;border-radius:999px;background:#edf2f6;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9db4,#65b9f3);transition:width .25s ease}
.pct{margin-top:8px;color:#8797a8;font-size:.76rem}
#app{position:fixed;inset:0;display:none;background:#fff}#app iframe{width:100%;height:100%;border:0;display:block}
#reopen{position:fixed;right:14px;bottom:14px;z-index:30;display:none;padding:9px 14px;border-radius:11px;color:#fff;background:linear-gradient(135deg,#ffabc0,#ff7f9d);text-decoration:none;font-size:.82rem;box-shadow:0 8px 22px rgba(255,127,157,.24)}
</style>
</head>
<body>
<div id="splash"><div class="card"><div class="icon">💬</div><h1>Chatbot <span>ศูนย์ข้อมูล</span></h1><div class="sub">กำลังเตรียมระบบ</div><div class="status" id="status">กำลังเชื่อมต่อ Dashboard...</div><div class="bar"><i id="fill"></i></div><div class="pct" id="pct">0%</div></div></div>
<div id="app"><iframe id="frame" title="Dashboard" referrerpolicy="no-referrer"></iframe></div>
<a id="reopen" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>
<script>
var DASH_URL='https://script.google.com/macros/s/AKfycbwojYt6ZB4aAI8QvKqFdFzr3_72ccwYRnhYENrAF-7PpRyr6AOBkL7NWOg5KELipznp/exec';
var splash=document.getElementById('splash'),app=document.getElementById('app'),frame=document.getElementById('frame'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),status=document.getElementById('status'),reopen=document.getElementById('reopen');
var progress=0,done=false;frame.src=DASH_URL;reopen.href=DASH_URL;
frame.addEventListener('load',function(){if(done)return;done=true;fill.style.width='100%';pct.textContent='100%';status.textContent='พร้อมใช้งาน';setTimeout(function(){splash.style.opacity='0';splash.style.visibility='hidden';app.style.display='block';reopen.style.display='block'},250)});
var timer=setInterval(function(){if(done){clearInterval(timer);return}progress=Math.min(92,progress+(progress<60?4:1.5));fill.style.width=progress+'%';pct.textContent=Math.round(progress)+'%'},100);
setTimeout(function(){if(!done){status.textContent='กำลังเชื่อมต่อระบบ...';reopen.style.display='block'}},10000);
</script>
</body>
</html>
