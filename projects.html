<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMs Projects</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="mms-pro.css"></head><body><div class="wrap"><header class="top glass"><div class="brand">MMs</div><div class="title">PROJECTS<small>Autosave • Versions • Restore</small></div><div class="spacer"></div><button class="btn" onclick="loadProjects()">↻</button><button class="btn" data-mms-back>↑ เมนู</button></header><main class="grid"><section class="panel glass col-4"><h2>สร้างโปรเจกต์</h2><div class="help">ใช้ Project รวมไฟล์ งานตัดต่อ และประวัติเวอร์ชันไว้ด้วยกัน</div><div class="field" style="margin-top:9px"><label>ชื่อ</label><input id="newTitle" placeholder="เช่น CCTV ประตูหน้า"></div><div class="field" style="margin-top:8px"><label>ประเภท</label><select id="newType"><option value="video">Video</option><option value="cctv">CCTV</option><option value="audio">Audio</option><option value="document">Document</option><option value="mixed">Mixed</option></select></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="createProject()">+ สร้าง Project</button><hr style="border:0;border-top:1px solid #e5ebf3;margin:14px 0"><h3>รายการ</h3><div id="projects" class="list"></div></section><section class="panel glass col-8"><div id="editor"><div class="empty">เลือก Project เพื่อแก้ไข</div></div></section></main></div><div id="toast" class="toast"></div><script src="mms-pro-client.js"></script><script src="mms-shell-bridge.js"></script><script>const P=MmsPro,$=s=>document.querySelector(s);let LIST=[],CURRENT=null,TIMER=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}async function loadProjects(){const d=await P.api('projects-list');if(!d.ok)return toast(d.error||'โหลดไม่สำเร็จ');LIST=d.projects||[];renderList();if(CURRENT){CURRENT=LIST.find(x=>x.id===CURRENT.id)||CURRENT;renderEditor()}}function renderList(){$('#projects').innerHTML=LIST.length?LIST.map(x=>`<button class="item" style="text-align:left;width:100%;cursor:pointer" onclick="openProject('${x.id}')"><b>${P.esc(x.title)}</b><div class="meta">${P.esc(x.project_type)} • v${x.current_version||0} • ${P.dt(x.updated_at)}</div></button>`).join(''):'<div class="empty">ยังไม่มี Project</div>'}async function createProject(){const d=await P.api('project-create',{title:$('#newTitle').value.trim(),project_type:$('#newType').value});if(!d.ok)return toast(d.error||'สร้างไม่สำเร็จ');$('#newTitle').value='';toast('สร้าง Project แล้ว');await loadProjects();openProject(d.project.id)}function openProject(id){CURRENT=LIST.find(x=>x.id===id);renderEditor();loadVersions()}function notesOf(){return String(CURRENT?.settings?.notes||'')}function renderEditor(){if(!CURRENT)return;$('#editor').innerHTML=`<div class="row"><div><h2>${P.esc(CURRENT.title)}</h2><div class="sub">${P.esc(CURRENT.project_type)} • Autosave ${P.dt(CURRENT.autosave_at)}</div></div><div class="spacer"></div><span class="badge">v${CURRENT.current_version||0}</span><button class="btn primary" onclick="saveVersion()">บันทึก Version</button></div><div class="help">พิมพ์รายละเอียดได้เลย ระบบจะ Autosave อัตโนมัติ • กด Version เมื่อต้องการเก็บจุดย้อนกลับถาวร</div><div class="field" style="margin-top:9px"><label>บันทึกงาน</label><textarea id="notes" rows="10" placeholder="รายละเอียดงาน จุดสำคัญ หรือคำสั่งเพิ่มเติม">${P.esc(notesOf())}</textarea></div><div class="row" style="margin-top:8px"><span class="meta" id="autoState">Autosave ภายใน 1.2 วินาที</span><div class="spacer"></div><button class="btn" onclick="autosave(true)">บันทึกทันที</button></div><hr style="border:0;border-top:1px solid #e5ebf3;margin:15px 0"><h3>Version History</h3><div id="versions" class="list"><div class="empty">กำลังโหลด...</div></div>`;$('#notes').addEventListener('input',()=>{clearTimeout(TIMER);$('#autoState').textContent='กำลังรอ Autosave...';TIMER=setTimeout(()=>autosave(false),1200)})}async function autosave(manual){if(!CURRENT)return;const snapshot={...(CURRENT.settings||{}),notes:$('#notes').value};const d=await P.api('project-autosave',{id:CURRENT.id,snapshot});if(!d.ok)return toast(d.error||'Autosave ไม่สำเร็จ');CURRENT=d.project;$('#autoState').textContent='Autosave แล้ว '+P.dt(CURRENT.autosave_at);if(manual)toast('บันทึกแล้ว')}async function saveVersion(){if(!CURRENT)return;await autosave(false);const note=prompt('หมายเหตุ Version (ไม่บังคับ)','');const snapshot={...(CURRENT.settings||{}),notes:$('#notes').value};const d=await P.api('project-save-version',{id:CURRENT.id,snapshot,note:note||''});if(!d.ok)return toast(d.error||'บันทึก Version ไม่สำเร็จ');toast('สร้าง Version '+d.version.version_no);await loadProjects();await loadVersions()}async function loadVersions(){if(!CURRENT)return;const d=await P.api('project-versions',{id:CURRENT.id});const box=$('#versions');if(!box)return;if(!d.ok){box.innerHTML='<div class="empty">โหลด Version ไม่สำเร็จ</div>';return}box.innerHTML=(d.versions||[]).length?(d.versions||[]).map(v=>`<div class="item"><div class="item-head"><div class="grow"><b>Version ${v.version_no}</b><div class="meta">${P.dt(v.created_at)} ${v.note?'• '+P.esc(v.note):''}</div></div><span class="badge">Snapshot</span></div><div class="meta" style="margin-top:6px">${P.esc(String(v.snapshot?.notes||'').slice(0,180))}</div></div>`).join(''):'<div class="empty">ยังไม่มี Version ที่บันทึกถาวร</div>'}loadProjects();</script></body></html>
