<style id="dashboard-help-v3-style">
  #dashboard-help-v3{font-family:'Prompt','Sarabun',sans-serif;color:#eef2ff}
  #dashboard-help-v3 *{box-sizing:border-box}
  #dashboard-help-v3 .hv3-wrap{display:grid;gap:16px}
  #dashboard-help-v3 .hv3-hero{padding:18px;border:1px solid rgba(251,191,36,.24);border-radius:16px;background:linear-gradient(135deg,rgba(251,191,36,.10),rgba(96,165,250,.08))}
  #dashboard-help-v3 .hv3-hero h2{margin:0 0 6px;color:#fff5db;font-size:1.15rem}
  #dashboard-help-v3 .hv3-hero p{margin:0;color:#9aa6c4;font-size:.9rem;line-height:1.6}
  #dashboard-help-v3 .hv3-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  #dashboard-help-v3 .hv3-card{padding:16px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));box-shadow:0 10px 28px rgba(0,0,0,.25)}
  #dashboard-help-v3 .hv3-card h3{margin:0 0 10px;color:#fcd34d;font-size:1rem}
  #dashboard-help-v3 .hv3-card ul{margin:0;padding-left:20px;color:#d8e1f1;line-height:1.7;font-size:.9rem}
  #dashboard-help-v3 .hv3-code{display:block;margin:7px 0;padding:9px 10px;border:1px solid rgba(96,165,250,.20);border-radius:9px;background:rgba(0,0,0,.28);color:#dbeafe;font-family:Consolas,'Courier New',monospace;font-size:.84rem;overflow-wrap:anywhere}
  #dashboard-help-v3 .hv3-note{padding:12px 14px;border-left:4px solid #fbbf24;border-radius:8px;background:rgba(251,191,36,.09);color:#ffe9b0;line-height:1.6;font-size:.88rem}
  #dashboard-help-v3 .hv3-table-wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.10);border-radius:12px}
  #dashboard-help-v3 table{width:100%;border-collapse:collapse;min-width:680px;font-size:.86rem}
  #dashboard-help-v3 th{padding:10px;background:rgba(96,165,250,.14);color:#dbe7ff;text-align:left}
  #dashboard-help-v3 td{padding:10px;border-top:1px solid rgba(255,255,255,.07);color:#cdd7ea}
  #dashboard-help-v3 .hv3-on{color:#7ff0c8;font-weight:600}
  #dashboard-help-v3 .hv3-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  #dashboard-help-v3 .hv3-badge{padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:#d8e1f1;font-size:.78rem}
  #dashboard-help-v3 .hv3-footer{font-size:.78rem;color:#7f8aa5;text-align:right}
  @media(max-width:760px){#dashboard-help-v3 .hv3-grid{grid-template-columns:1fr}}

  #hv3-float{position:fixed;right:16px;bottom:72px;z-index:2147482000;border:0;border-radius:999px;padding:10px 14px;background:linear-gradient(135deg,#f6b545,#f59e0b);color:#2a1c00;font:600 14px 'Prompt','Sarabun',sans-serif;box-shadow:0 10px 24px rgba(251,191,36,.30);cursor:pointer;display:none}
  #hv3-modal{position:fixed;inset:0;z-index:2147482500;background:rgba(3,5,12,.72);backdrop-filter:blur(6px);padding:18px;overflow:auto;display:none}
  #hv3-modal.show{display:block}
  #hv3-modal .hv3-modal-card{max-width:980px;margin:20px auto;padding:18px;border-radius:18px;background:#0e1430;border:1px solid rgba(251,191,36,.22);box-shadow:0 28px 70px rgba(0,0,0,.55)}
  #hv3-modal .hv3-modal-head{display:flex;justify-content:flex-end;margin-bottom:8px}
  #hv3-close{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#eef2ff;border-radius:9px;padding:7px 11px;cursor:pointer}
</style>

<template id="dashboard-help-v3-template">
  <section id="dashboard-help-v3">
    <div class="hv3-wrap">
      <div class="hv3-hero">
        <h2>📖 คู่มือการใช้งาน LINE Bot — ศาลจังหวัดลพบุรี</h2>
        <p>อัปเดตรูปแบบการค้นหาให้แยกชัดเจนระหว่างแชทส่วนตัวกับกลุ่ม LINE และรวมบัญชีนัด ฐานความรู้ และฐานค้นหาที่เปิดใช้งานไว้ในคู่มือเดียวกัน</p>
      </div>
      <div class="hv3-grid">
        <article class="hv3-card">
          <h3>💬 แชทส่วนตัว</h3>
          <ul id="hv3-private-lines"></ul>
          <div id="hv3-private-examples"></div>
        </article>
        <article class="hv3-card">
          <h3>👥 กลุ่ม LINE</h3>
          <ul id="hv3-group-lines"></ul>
          <div id="hv3-group-examples"></div>
        </article>
      </div>
      <div class="hv3-note"><strong>⚖️ บัญชีนัดในกลุ่ม:</strong> พิมพ์ <b>บัญชีนัด วันนี้</b>, <b>บัญชีนัด พรุ่งนี้</b> หรือ <b>บัญชีนัด 14 สิงหาคม 2569</b> ได้ทันที — <strong>ไม่ต้องใช้ “บอท” นำหน้า</strong></div>
      <article class="hv3-card">
        <h3>🔎 แหล่งข้อมูลที่ระบบค้นหา</h3>
        <div class="hv3-table-wrap">
          <table><thead><tr><th>#</th><th>ฐาน</th><th>ชีตต้นทาง</th><th>สิทธิ์</th><th>สถานะ</th></tr></thead><tbody id="hv3-db-rows"></tbody></table>
        </div>
        <div class="hv3-badges" id="hv3-extra-sources"></div>
      </article>
      <article class="hv3-card">
        <h3>🔐 ระดับสิทธิ์</h3>
        <div class="hv3-badges" id="hv3-permissions"></div>
        <div class="hv3-note" style="margin-top:12px">หากผู้ใช้ไม่มีสิทธิ์ ระบบต้องไม่แสดงข้อมูลจากฐาน Internal/Admin แม้คำค้นจะตรงกันก็ตาม</div>
      </article>
      <article class="hv3-card">
        <h3>🆘 คำสั่งช่วยเหลือ</h3>
        <span class="hv3-code">/ช่วยเหลือ</span>
        <span class="hv3-code">/help</span>
        <p style="margin:8px 0 0;color:#9aa6c4;font-size:.86rem">คำสั่งนี้ควรแสดงคู่มือฉบับย่อชุดเดียวกับข้อมูลในหน้านี้</p>
      </article>
      <div class="hv3-footer" id="hv3-version"></div>
    </div>
  </section>
</template>

<button id="hv3-float" type="button">📖 คู่มือการใช้งาน</button>
<div id="hv3-modal" aria-hidden="true"><div class="hv3-modal-card"><div class="hv3-modal-head"><button id="hv3-close" type="button">✕ ปิด</button></div><div id="hv3-modal-body"></div></div></div>

<script id="dashboard-help-v3-script">
(function(){
  'use strict';
  const FALLBACK={
    version:'2026-08-14-v3',
    privateSearch:{lines:['ค้นหาทั่วไป/ฐานความรู้: ค้นหา <คำค้น>','เจาะฐานโดยตรง: ค้นหา [ชื่อฐาน] <คำค้น>','บัญชีนัด: บัญชีนัด วันนี้ | พรุ่งนี้ | มะรืน | 14 สิงหาคม 2569','ศูนย์ประสานงานคดีออนไลน์: ศูนย์ประสานงานคดี','ดูคู่มือฉบับย่อ: /ช่วยเหลือ หรือ /help'],examples:['ค้นหา ลิงก์ห้อง','ค้นหา [เวรเสื้อฟ้า] ชนินทร์','ค้นหา [เขตส่งหมาย] ถนนใหญ่','บัญชีนัด วันนี้','บัญชีนัด 14 สิงหาคม 2569']},
    groupSearch:{lines:['ฐานความรู้/ฐานค้นหา: /บอท ค้นหา <คำค้น>','เจาะฐานโดยตรง: /บอท ค้นหา [ชื่อฐาน] <คำค้น>','บัญชีนัด: เรียกตรงได้ ไม่ต้องใช้คำว่า “บอท” นำหน้า','บางกลุ่มภารกิจส่งหมายอาจถูกตั้งให้รับเฉพาะพิกัด/รูป จึงปิด KB+DB Search ตามการตั้งค่าของกลุ่ม'],examples:['/บอท ค้นหา ลิงก์ห้อง','/บอท ค้นหา [เวรเสื้อฟ้า] ชนินทร์','/บอท ค้นหา [เขตส่งหมาย] ท่าแค','/บอท ค้นหา [ส่งหมาย] สิงหาคม','บัญชีนัด วันนี้','บัญชีนัด 14 สิงหาคม 2569']},
    databases:[
      {no:1,icon:'📞',name:'ผู้ใหญ่บ้าน',sheet:'Village',access:'Admin',status:'ON'},
      {no:2,icon:'📄',name:'ต่อเนื่อง',sheet:'sheets1',access:'Internal',status:'ON'},
      {no:3,icon:'📤',name:'คำขอคัดถ่าย',sheet:'ขอคัดถ่าย',access:'Internal',status:'ON'},
      {no:4,icon:'📞',name:'เบอร์ทนาย',sheet:'ค้นหาทนาย',access:'Internal',status:'ON'},
      {no:5,icon:'📤',name:'ส่งหมาย',sheet:'LINE-ค้นหาส่งหมายรายเดือน',access:'Admin',status:'ON'},
      {no:6,icon:'📤',name:'เวรเสื้อฟ้า',sheet:'เวรเสื้อฟ้า',access:'Internal',status:'ON'},
      {no:7,icon:'🗺️',name:'เขตส่งหมาย',sheet:'LINE-ค้นหาพื้นที่หมาย',access:'Internal',status:'ON'}
    ],
    extraSources:[{icon:'⚖️',name:'บัญชีนัด',detail:'Database + Database_LastWeek',access:'VIP/Admin'},{icon:'📚',name:'ฐานความรู้',detail:'ชีต ความรู้',access:'ตามสิทธิ์รายการ'}],
    permissions:[{level:'Public/User',detail:'ใช้ข้อมูล Public'},{level:'Internal/VIP',detail:'ใช้ข้อมูล Internal และ Public'},{level:'Admin',detail:'ใช้ข้อมูล Admin, Internal และ Public'}]
  };

  function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}
  function templateClone(){return document.getElementById('dashboard-help-v3-template').content.cloneNode(true);}
  function render(root,g){
    root.querySelector('#hv3-private-lines').innerHTML=(g.privateSearch.lines||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
    root.querySelector('#hv3-group-lines').innerHTML=(g.groupSearch.lines||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
    root.querySelector('#hv3-private-examples').innerHTML=(g.privateSearch.examples||[]).map(x=>'<span class="hv3-code">'+esc(x)+'</span>').join('');
    root.querySelector('#hv3-group-examples').innerHTML=(g.groupSearch.examples||[]).map(x=>'<span class="hv3-code">'+esc(x)+'</span>').join('');
    root.querySelector('#hv3-db-rows').innerHTML=(g.databases||[]).map(d=>'<tr><td>'+esc(d.no)+'</td><td>'+esc(d.icon+' '+d.name)+'</td><td>'+esc(d.sheet)+'</td><td>'+esc(d.access)+'</td><td class="hv3-on">🟢 '+esc(d.status)+'</td></tr>').join('');
    root.querySelector('#hv3-extra-sources').innerHTML=(g.extraSources||[]).map(x=>'<span class="hv3-badge">'+esc(x.icon+' '+x.name+' · '+x.detail+' · '+x.access)+'</span>').join('');
    root.querySelector('#hv3-permissions').innerHTML=(g.permissions||[]).map(x=>'<span class="hv3-badge">'+esc(x.level+' — '+x.detail)+'</span>').join('');
    root.querySelector('#hv3-version').textContent='คู่มือเวอร์ชัน '+(g.version||'2026-08-14-v3');
  }
  function locateTarget(){
    const selectors=['#helpContent','#guideContent','#help-content','#guide-content','#page-help .card-body','#page-guide .card-body','.help-page','.guide-page'];
    for(const s of selectors){const el=document.querySelector(s);if(el)return el;}
    const candidates=[...document.querySelectorAll('h1,h2,h3,h4,.page-title,.card-header')];
    const h=candidates.find(el=>/คู่มือการใช้งาน/.test((el.textContent||'').trim()));
    if(h){return h.closest('.card,.help-card,section,.page')||h.parentElement;}
    return null;
  }
  function mount(g){
    const target=locateTarget();
    if(target){
      const old=target.querySelector('#dashboard-help-v3'); if(old) old.remove();
      const frag=templateClone(); target.appendChild(frag); render(target,g); document.getElementById('hv3-float').style.display='none';
    }else{
      const body=document.getElementById('hv3-modal-body'); body.innerHTML=''; body.appendChild(templateClone()); render(body,g); document.getElementById('hv3-float').style.display='block';
    }
  }
  function load(){
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(g=>mount(g||FALLBACK)).withFailureHandler(()=>mount(FALLBACK)).getUnifiedUsageGuide();
    }else mount(FALLBACK);
  }
  const modal=document.getElementById('hv3-modal');
  document.getElementById('hv3-float').addEventListener('click',()=>{modal.classList.add('show');modal.setAttribute('aria-hidden','false');});
  document.getElementById('hv3-close').addEventListener('click',()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');});
  modal.addEventListener('click',e=>{if(e.target===modal)document.getElementById('hv3-close').click();});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
})();
</script>
