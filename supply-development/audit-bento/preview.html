<!doctype html><html lang="th"><meta charset="utf-8"><title>ตรวจหน้าจอระบบวัสดุด้วยข้อมูลจำลอง</title><style>body{font:16px sans-serif;background:#e6edf5;padding:16px;margin:0;min-width:max-content}header{position:sticky;left:16px;max-width:1200px;margin-bottom:16px}button,select{font:inherit;padding:10px;margin:3px;border:1px solid #b7c5d8;border-radius:10px;background:white}iframe{display:block;border:1px solid #b7c5d8;border-radius:14px;background:white}b{color:#193d69}p{margin:8px 0}</style><header><b>ภาพทดสอบด้วยข้อมูลจำลอง · ไม่เชื่อมฐานข้อมูลจริง</b><p><label>บทบาท <select id="role"><option value="OFFICER">เจ้าหน้าที่พัสดุ</option><option value="ADMIN">ผู้ดูแลระบบ</option><option value="USER">ผู้ขอเบิก</option></select></label><label>หน้า <select id="page"><option value="home">ภาพรวม</option><option value="dash">สถิติ</option><option value="receive">รับเข้า</option></select></label></p><div><button data-w="390">มือถือ 390</button><button data-w="740">แท็บเล็ต 740</button><button data-w="1100">แล็ปท็อป 1100</button><button data-w="1600">เดสก์ท็อป 1600</button></div></header><iframe id="frame" width="1600" height="1120" title="ตัวอย่างหน้าระบบ"></iframe><script>const f=document.querySelector('#frame');function load(){f.src='preview-frame.html?role='+document.querySelector('#role').value+'&page='+document.querySelector('#page').value}document.querySelectorAll('select').forEach(x=>x.onchange=load);document.querySelectorAll('[data-w]').forEach(x=>x.onclick=()=>{f.width=x.dataset.w;f.height=Number(x.dataset.w)<480?'2100':'1120'});load();</script></html>
