<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>จับคู่มือถือ | PC Remote Control Center</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="main" style="max-width:720px;margin:auto">
    <header class="topbar"><div><h1>จับคู่มือถือ</h1><p>เข้าสู่ระบบด้วยบัญชีเดียวกับเครื่องที่ต้องการควบคุม</p></div></header>
    <section id="setupBanner" class="banner warning hidden">ยังไม่ได้ตั้งค่า Supabase</section>
    <section id="loginCard" class="login-card">
      <h2>เข้าสู่ระบบ</h2>
      <label>อีเมล<input id="email" type="email" autocomplete="username"></label>
      <label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password"></label>
      <button id="loginBtn" class="primary">เข้าสู่ระบบ</button>
      <p id="loginMessage" class="message"></p>
    </section>
    <section id="pairCard" class="panel hidden">
      <div class="panel-head"><div><span class="eyebrow">PAIR DEVICE</span><h3>ยืนยันการเชื่อมต่อ</h3></div></div>
      <p id="pairInfo">กำลังตรวจสอบรหัสจับคู่...</p>
      <button id="confirmPairBtn" class="primary" disabled>ยืนยันเชื่อมต่อมือถือเครื่องนี้</button>
      <p id="pairMessage" class="message"></p>
      <p><a id="goDashboard" href="index.html" class="ghost hidden">เปิดศูนย์ควบคุม</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/pair.js"></script>
</body>
</html>
