<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>YouTube Car · รีโมต</title>
<style>:root{font-family:system-ui,"Noto Sans Thai",sans-serif;background:#111;color:white;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100dvh;display:flex;justify-content:center}main{width:min(100%,520px)}h1{font-size:28px;margin:0 0 8px}.muted{color:#bbb}p{font-size:16px;line-height:1.5}button,input{font:inherit}button{border:0;border-radius:15px;background:#2c2c2c;color:#fff;min-height:66px;font-size:24px;touch-action:manipulation}button:active{background:#444}.red{background:#e33b3b}.search{display:flex;gap:8px;margin:19px 0}.search input{min-width:0;flex:1;border-radius:13px;border:1px solid #555;background:#202020;color:white;padding:12px;font-size:18px}.search button{padding:0 20px;font-size:18px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:span 3}label{display:block;margin:25px 0 12px;font-size:18px}input[type=range]{width:100%;accent-color:#e33b3b;height:32px}.status{padding:13px;border-radius:12px;background:#242424;margin:18px 0;font-size:17px}a{color:#e9bbbb}.back{display:inline-block;margin-top:17px}</style></head>
<body><main><h1>📱 YouTube Car Remote</h1><p class="muted">ควบคุมวิดีโอบนจอรถจากมือถือ</p><div id="status" class="status">กำลังเชื่อมต่อ...</div>
<form id="form" class="search"><input id="query" placeholder="ค้นหาการ์ตูนหรือเพลง" aria-label="ค้นหาวิดีโอ"><button class="red" type="submit">ค้นหา</button></form>
<div class="buttons"><button id="previous" title="ก่อนหน้า">⏮</button><button id="play" class="red" title="เล่นหรือหยุด">▶ / ❚❚</button><button id="next" title="ถัดไป">⏭</button></div>
<label for="volume">🔊 ระดับเสียง</label><input id="volume" type="range" min="0" max="100" value="80"><p id="message" class="muted">มือถือและจอรถต้องเชื่อมอินเทอร์เน็ตได้ทั้งคู่</p><a class="back" href="car.html">เปิดหน้าจอรถ</a></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const room=(params.get('r')||'').toLowerCase();const secret=location.hash.slice(1);const ROOT='car_remote_v1',DB='https://court-media-controller-default-rtdb.asia-southeast1.firebasedatabase.app';let ref=null,seq=0;
function status(t){$('status').textContent=t}function script(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.async=true;e.onload=ok;e.onerror=()=>no(Error('โหลดส่วนเชื่อมต่อไม่สำเร็จ'));document.head.append(e)})}
async function connect(){if(!/^[a-f0-9]{8}$/.test(room)||!/^[a-f0-9]{24}$/.test(secret)){status('ลิงก์รีโมตไม่ถูกต้อง กรุณาสแกน QR จากจอรถ');return}try{await script('../assets/run/firebase-app-compat.js');await script('../assets/run/firebase-database-compat.js');const app=window.firebase.initializeApp({databaseURL:DB},'yt-car-remote');const db=app.database();ref=db.ref(ROOT+'/'+room);ref.child('host/status').on('value',s=>status(s.val()==='online'?'🟢 เชื่อมต่อกับจอรถแล้ว':'⚪ จอรถยังไม่พร้อม'));await ref.child('host').once('value').then(s=>{if(!s.exists())status('ยังไม่พบห้องรีโมต กรุณาเปิดหน้าจอรถก่อน')});}catch(e){status('ไม่สามารถเชื่อมต่อ Firebase ได้: '+e.message)}}
async function send(action,value=null){if(!ref){$('message').textContent='ยังไม่ได้เชื่อมต่อกับจอรถ';return}const stamp=Date.now();seq=Math.max(stamp,seq+1);try{await ref.child('command').set({secret,seq,action,value});$('message').textContent='ส่งคำสั่งแล้ว'}catch(e){$('message').textContent='ส่งคำสั่งไม่สำเร็จ: '+e.message}}
$('previous').onclick=()=>send('previous');$('play').onclick=()=>send('play');$('next').onclick=()=>send('next');$('form').onsubmit=e=>{e.preventDefault();const q=$('query').value.trim();if(q)send('search',q)};let volumeTimer=null;$('volume').oninput=e=>{clearTimeout(volumeTimer);const value=+e.target.value;volumeTimer=setTimeout(()=>send('volume',value),110)};connect();
})();
</script></body></html>
