<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMs CCTV Review Player</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="mms-pro.css"><style>.player{background:#091322;border-radius:18px;overflow:hidden;position:relative}.player video{width:100%;max-height:68vh;display:block;background:#000}.hud{position:absolute;left:10px;top:10px;background:rgba(5,12,22,.68);color:#fff;border-radius:10px;padding:5px 8px;font-size:11px}.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:9px}.controls .btn{min-width:52px}.speed{display:flex;gap:5px;flex-wrap:wrap}.speed button.on{color:#fff;background:linear-gradient(90deg,var(--blue),var(--purple));border-color:transparent}.timeline{width:100%}</style></head><body><div class="wrap"><header class="top glass"><div class="brand">MMs</div><div class="title">CCTV REVIEW PLAYER<small>Slow Motion • Frame Step • Event Loop • Original Playback</small></div><div class="spacer"></div><button class="btn" onclick="history.back()">↑ กลับ</button></header><main class="grid"><section class="panel glass col-12"><div class="player"><video id="v" controls playsinline preload="metadata"></video><div id="hud" class="hud">กำลังโหลด...</div></div><input id="seek" class="timeline" type="range" min="0" max="1000" value="0"><div class="controls"><button class="btn" data-step="-10">−10s</button><button class="btn" data-step="-5">−5s</button><button class="btn" data-step="-3">−3s</button><button class="btn" data-step="-1">−1s</button><button class="btn" data-step="-.1">−0.1</button><button class="btn" id="prevFrame">◀ Frame</button><button class="btn primary" id="play">▶ เล่น</button><button class="btn" id="nextFrame">Frame ▶</button><button class="btn" data-step=".1">+0.1</button><button class="btn" data-step="1">+1s</button><button class="btn" data-step="3">+3s</button><button class="btn" data-step="5">+5s</button><button class="btn" data-step="10">+10s</button></div><div class="row" style="margin-top:10px"><b>ความเร็ว</b><div id="speeds" class="speed"></div><label class="badge"><input id="loop" type="checkbox"> Loop ช่วงเหตุการณ์</label><span id="meta" class="meta"></span></div><div class="hint" style="margin-top:9px">Forensic Mode: การเปลี่ยนความเร็วเป็นการเล่น Preview เท่านั้น ไม่แก้ไข Original และไม่สร้างเฟรมแทรกอัตโนมัติ</div></section></main></div><script src="mms-pro-client.js"></script><script>const P=MmsPro,$=s=>document.querySelector(s),q=new URLSearchParams(location.search),id=q.get('media'),start=Math.max(0,Number(q.get('start')||0)/1000),end=Math.max(0,Number(q.get('end')||0)/1000);let fps=30;const v=$('#v'),rates=[.1,.25,.5,.75,1,1.5,2,4];function fmt(s){return P.ms(s*1000)}async function boot(){if(!id){$('#hud').textContent='ไม่พบ Media ID';return}const [u,l]=await Promise.all([P.api('media-download-url',{id}),P.api('library-list',{limit:300})]);if(!u.ok){$('#hud').textContent=u.error||'เปิดไฟล์ไม่ได้';return}const m=(l.files||[]).find(x=>x.id===id);if(m?.fps)fps=Number(m.fps)||30;$('#meta').textContent=`FPS ${fps.toFixed(2)} • ${P.esc(m?.codec||'codec รอตรวจ')} • Original`;v.src=u.url;v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(v.duration,start);$('#seek').max=Math.round(v.duration*1000);hud()});v.addEventListener('timeupdate',()=>{$('#seek').value=Math.round(v.currentTime*1000);if($('#loop').checked&&end>start&&v.currentTime>=end)v.currentTime=start;hud()})}function hud(){$('#hud').textContent=`${fmt(v.currentTime||0)} / ${fmt(v.duration||0)} • ${v.playbackRate.toFixed(2)}x${end>start?` • Event ${fmt(start)}–${fmt(end)}`:''}`}$('#seek').oninput=()=>v.currentTime=Number($('#seek').value)/1000;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>v.currentTime=Math.max(0,Math.min(v.duration||Infinity,v.currentTime+Number(b.dataset.step))));$('#prevFrame').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-1/fps)};$('#nextFrame').onclick=()=>{v.pause();v.currentTime=Math.min(v.duration||Infinity,v.currentTime+1/fps)};$('#play').onclick=()=>v.paused?v.play():v.pause();v.onplay=()=>$('#play').textContent='❚❚ พัก';v.onpause=()=>$('#play').textContent='▶ เล่น';$('#speeds').innerHTML=rates.map(r=>`<button class="btn ${r===1?'on':''}" data-rate="${r}">${r.toFixed(r<1?2:r%1?1:0)}x</button>`).join('');document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{v.playbackRate=Number(b.dataset.rate);document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b));hud()});boot();</script></body></html>
