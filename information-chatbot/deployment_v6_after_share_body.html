n: 16px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; \x7d\\n    .footer \x7b text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; \x7d\\n    @keyframes breathe \x7b 50% \x7b transform: translateY(-4px) scale(1.03); \x7d \x7d\\n    @keyframes fadeOut \x7b to \x7b opacity: 0; visibility: hidden; transform: translateY(-5px); \x7d \x7d\\n    @keyframes slideUp \x7b from \x7b opacity: 0; transform: translateY(12px); \x7d to \x7b opacity: 1; transform: translateY(0); \x7d \x7d\\n    @media (prefers-reduced-motion: reduce) \x7b *, *::before, *::after \x7b animation-duration: .01ms !important; animation-iteration-count: 1 !important; \x7d \x7d\\n  \x3c\\\/style\x3e\\n\x3c\\\/head\x3e\\n\x3cbody\x3e\\n  \x3cmain class\x3d\\\x22shell\\\x22 aria-live\x3d\\\x22polite\\\x22\x3e\\n    \x3csection class\x3d\\\x22loading\\\x22 id\x3d\\\x22loading\\\x22 aria-label\x3d\\\x22กำลังโหลดระบบ\\\x22\x3e\\n      \x3cdiv class\x3d\\\x22loading-mark\\\x22\x3eN\x3c\\\/div\x3e\\n      \x3cdiv class\x3d\\\x22loading-title\\\x22\x3eกำลังเตรียม NewBot AI\x3c\\\/div\x3e\\n      \x3cdiv class\x3d\\\x22loading-subtitle\\\x22\x3eระบบผู้ช่วยข้อมูลสำหรับผู้ดูแล\x3c\\\/div\x3e\\n    \x3c\\\/section\x3e\\n\\n    \x3csection class\x3d\\\x22login-card\\\x22 id\x3d\\\x22loginCard\\\x22 aria-labelledby\x3d\\\x22loginTitle\\\x22\x3e\\n      \x3cdiv class\x3d\\\x22brand-row\\\x22\x3e\\n        \x3cdiv class\x3d\\\x22brand-icon\\\x22\x3eN\x3c\\\/div\x3e\\n        \x3cdiv\x3e\\n          \x3cdiv class\x3d\\\x22eyebrow\\\x22\x3eNEWBOT AI · ADMIN CONSOLE\x3c\\\/div\x3e\\n          \x3ch1 id\x3d\\\x22loginTitle\\\x22\x3eเข้าสู่ระบบผู้ดูแล\x3c\\\/h1\x3e\\n        \x3c\\\/div\x3e\\n      \x3c\\\/div\x3e\\n      \x3cp class\x3d\\\x22subtitle\\\x22\x3eระบบนี้แยกจาก Main Chatbot production กรุณาใช้รหัส Admin ของบอทใหม่เท่านั้น\x3c\\\/p\x3e\\n      \x3cdiv class\x3d\\\x22notice\\\x22 id\x3d\\\x22notice\\\x22 role\x3d\\\x22alert\\\x22\x3eรหัสไม่ถูกต้อง หรือยังไม่มีสิทธิ์เข้าใช้งาน กร entListener(\x27click\x27, function () \x7b\\n        var hidden \x3d input.type \x3d\x3d\x3d \x27password\x27;\\n        input.type \x3d hidden ? \x27text\x27 : \x27password\x27;\\n        toggle.textContent \x3d hidden ? \x27ซ่อน\x27 : \x27แสดง\x27;\\n      \x7d);\\n      form.addEventListener(\x27submit\x27, function (event) \x7b\\n        event.preventDefault();\\n        var key \x3d String(input.value || \x27\x27).trim();\\n        if (!key) \x7b input.focus(); return; \x7d\\n        window.location.assign(window.location.pathname + \x27?adminKey\x3d\x27 + encodeURIComponent(key));\\n      \x7d);\\n    \x7d());\\n  \x3c\\\/script\x3e\\n\x3c\\\/body\x3e\\n\x3c\\\/html\x3e\\n\x22,\x22ncc\x22:\x22\x7b\\\x22awhs\\\x22:true\x7d\x22\x7d", "", undefined, true , false  , "false", "https:\/\/n-wlrjzw3fpz5tvs5dwawm4fi2uzytvvvz5w4bkda-0lu-script.googleusercontent.com", "https:\/\/drive.google.com\/abuse?id\x3dAAMpA0Rb6AbJSMjDs8bbszjDN6zoTuICrbtqyGBhioG7r0lE4pSpOBP_uev6z8C_4TidgTfsFMcDhI55OtBr2xL9yi2IrSysTQnBRphA%3A0\x26docurl\x3dhttps%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbwI0qyeC8Agz76dXLfkAeabl2eNzOvxBS0eisdtQYhBBJV8hBmxYtFy_Ns-wBVcpYlo%2Fexec");}
