name: MMs Quality Check
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'media-system/worker/**'
      - 'media-system/supabase/functions/**'
      - '.github/workflows/mms-quality-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python worker syntax
        run: python -m py_compile media-system/worker/worker.py media-system/worker/health_runner.py
      - name: Extract and check inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re,pathlib
          pages=['media.html','media-library-v3.html','video-studio-v4.html','cctv-analysis.html','cctv-player.html','job-center.html','projects.html','admin-settings-v4.html']
          out=pathlib.Path('/tmp/mms-js');out.mkdir(exist_ok=True)
          for page in pages:
              text=pathlib.Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
              for i,s in enumerate(scripts):
                  (out/f'{pathlib.Path(page).stem}-{i}.js').write_text(s,encoding='utf-8')
          print('\n'.join(str(x) for x in out.glob('*.js')))
          PY
          for f in /tmp/mms-js/*.js; do node --check "$f"; done
          node --check mms-splitter.js
      - name: Required integration files and navigation
        shell: bash
        run: |
          test -f mms-shell-bridge.js
          test -f mms-workflow-client.js
          test -f mms-splitter.js
          test -f media-library-v3.html
          test -f video-studio-v4.html
          test -f media-system/worker/health_runner.py
          for f in media-library-v3.html video-studio-v4.html cctv-analysis.html cctv-player.html job-center.html projects.html admin-settings-v4.html; do
            grep -Eq "data-mms-(back|close)" "$f"
            if ! grep -q "mms-shell-bridge.js" "$f"; then
              grep -q "CLOSE_WORKSPACE" "$f"
            fi
          done
          grep -q "CLOSE_WORKSPACE" media.html
          grep -q "mms-splitter.js" media-library-v3.html
          grep -q "cctv_analyze" media-system/worker/worker.py
          grep -q "video_export" media-system/worker/worker.py
          grep -q "media_set_export" media-system/worker/worker.py
          grep -q "video_enhance" media-system/worker/worker.py
          grep -q "mms-workflow-api" mms-workflow-client.js
          grep -q "job-result-url" job-center.html
          grep -q "video-source-list" media-system/supabase/functions/mms-workflow-api/index-v4.ts
          grep -q "video-preview-source" media-system/supabase/functions/mms-workflow-api/index-v4.ts
