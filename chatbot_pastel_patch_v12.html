<!-- ============================================================
 CHATBOT PASTEL PATCH v12 — ONE SHOT
 วางท้าย Dashboard.html ก่อน </body> เพียงครั้งเดียว
 - เปลี่ยนเฉพาะธีม/สี/หน้าตา

<style id="chatbot-pastel-one-shot-v12">

/* ===== Gate เดิม: restyle โดยไม่แก้ handler ===== */
#dash-gate{background:linear-gradient(135deg,#fff0f4 0%,#fbfdff 50%,#edf8ff 100%)!important;padding:12px!important;}
#dash-gate .dg-glow{display:none!important;}
#dash-gate .p12-scene{position:relative!important;width:min(96vw,470px)!important;height:min(88vh,700px)!important;min-height:500px!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;}
#dash-gate .dg-card{position:relative!important;z-index:3!important;width:min(82vw,380px)!important;height:100%!important;min-height:500px!important;padding:34px 22px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;color:#24364b!important;background:#fff!important;border:1px solid #e4ebf1!important;border-radius:28px!important;box-shadow:0 26px 64px rgba(65,91,116,.13),inset 0 1px 0 rgba(255,255,255,.95)!important;backdrop-filter:none!important;overflow:hidden!important;}
#dash-gate .dg-card::before{content:"";position:absolute;inset:auto -24% -11% -24%;height:28%;background:linear-gradient(135deg,rgba(255,181,197,.25),rgba(255,255,255,0));border-radius:50% 50% 0 0;pointer-events:none;}
#dash-gate .dg-card h2{color:#24364b!important;-webkit-text-fill-color:#24364b!important;background:none!important;font-size:1.42rem!important;}
#dash-gate .dg-sub{color:#58aee8!important;background:#eef8ff!important;padding:5px 12px!important;border-radius:999px!important;margin-top:7px!important;}
#dash-gate .dg-card p{color:#40536a!important;}
#dash-gate .dg-inwrap{width:100%!important;}
#dash-gate #dg-code{background:#fff!important;color:#24364b!important;-webkit-text-fill-color:#24364b!important;border-color:#f0dce2!important;caret-color:#ff7898!important;}
#dash-gate #dg-code::placeholder{color:#9aa6b5!important;-webkit-text-fill-color:#9aa6b5!important;}
#dash-gate #dg-eye{background:#f5f8fb!important;color:#7d8b9a!important;}
#dash-gate #dg-btn{background:linear-gradient(135deg,#ffabc0,#ff7f9d)!important;color:#fff!important;box-shadow:0 10px 24px rgba(255,127,157,.24)!important;}
#dash-gate #dg-msg{color:#e66b7b!important;}

#dash-gate .p12-peek{position:absolute!important;z-index:2!important;left:-4px!important;top:50%!important;width:164px!important;height:230px!important;margin:0!important;transform:translate(-82%,-50%) rotate(-2deg)!important;transform-origin:70% 50%!important;filter:drop-shadow(0 16px 28px rgba(61,94,119,.18))!important;pointer-events:none!important;display:block!important;}
#dash-gate .p12-peek img{position:absolute!important;inset:0!important;margin:auto!important;display:block!important;max-width:100%!important;max-height:100%!important;width:auto!important;height:auto!important;background:transparent!important;}
#dash-gate .p12-lid{position:absolute;z-index:5;top:27%;width:12.5%;height:8.5%;border-radius:50%;background:#0b2731;opacity:0;transform:scaleY(.05);transform-origin:center;}
#dash-gate .p12-lid-l{left:35.3%}#dash-gate .p12-lid-r{left:55.0%}
#dash-gate .p12-peek.p12-active{animation:p12Peek 8s ease-in-out both!important;}
#dash-gate .p12-peek.p12-active .p12-lid{animation:p12Blink 8s linear both!important;}
@keyframes p12Peek{0%,6%{transform:translate(-82%,-50%) rotate(-2deg)}25%,87.5%{transform:translate(-8%,-50%) rotate(0)}100%{transform:translate(-82%,-50%) rotate(-2deg)}}
@keyframes p12Blink{0%,34%,37%,43%,54%,57%,63%,100%{opacity:0;transform:scaleY(.05)}35%,40%,55%,60%{opacity:1;transform:scaleY(1)}}
@media(min-width:481px){#dash-gate .p12-peek{left:-12px!important;width:190px!important;height:260px!important}}
@media(max-height:620px){#dash-gate .p12-scene{height:94vh!important;min-height:440px!important}#dash-gate .dg-card{min-height:440px!important;padding:24px 18px!important}#dash-gate .p12-peek{width:142px!important;height:202px!important}}
@media(prefers-reduced-motion:reduce){#dash-gate .p12-peek.p12-active,#dash-gate .p12-peek.p12-active .p12-lid{animation:none!important}#dash-gate .p12-peek{transform:translate(-16%,-50%)!important}}
</style>
<script id="chatbot-pastel-one-shot-v12-script">
(function(){
  function patchCharts(){
    try{
      if(!window.Chart)return;
      Chart.defaults.color='#66788b';
      Chart.defaults.borderColor='rgba(95,120,143,.12)';
      if(Chart.defaults.plugins&&Chart.defaults.plugins.legend&&Chart.defaults.plugins.legend.labels)Chart.defaults.plugins.legend.labels.color='#52667b';
      var reg=Chart.instances;if(reg){Object.keys(reg).forEach(function(k){try{reg[k].update()}catch(e){}})}
    }catch(e){}
  }

  function patchGate(){
    var gate=document.getElementById('dash-gate');if(!gate)return;
    var card=gate.querySelector('.dg-card');if(!card)return;
    var scene=gate.querySelector('.p12-scene');
    if(!scene){
      scene=document.createElement('div');scene.className='p12-scene';
      card.parentNode.insertBefore(scene,card);scene.appendChild(card);
    }

    var bot=gate.querySelector('.p12-peek')||gate.querySelector('.dg-peekbot')||gate.querySelector('.dg-bot');
    if(bot){
      bot.classList.add('p12-peek');
      if(bot.parentNode!==scene)scene.insertBefore(bot,card);
      if(!bot.querySelector('.p12-lid-l')){
        var l=document.createElement('i');l.className='p12-lid p12-lid-l';
        var r=document.createElement('i');r.className='p12-lid p12-lid-r';
        bot.appendChild(l);bot.appendChild(r);
      }
      function play(){bot.classList.remove('p12-active');void bot.offsetWidth;bot.classList.add('p12-active')}
      setTimeout(function(){play();setInterval(play,5*60*1000)},2000);
    }
  }

  function run(){patchGate();patchCharts();setTimeout(patchCharts,500);setTimeout(patchCharts,1500)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
